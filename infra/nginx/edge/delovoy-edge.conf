# TLS-edge (issue #453, ADR 2026-07-23 §I2): единственная задача — постквантовое
# рукопожатие (X25519MLKEM768). Всё остальное (blue-green upstream,
# static-archive, /api/health, security-заголовки) остаётся на host-nginx —
# см. infra/nginx/delovoy-park.conf — этот блок только проксирует туда по
# loopback после снятия TLS.
#
# Работает в контейнере nginx:mainline (Debian trixie, OpenSSL ≥3.5 из
# коробки — системный OpenSSL хоста 3.0.13 ML-KEM не умеет и не апгрейдится
# в рамках Ubuntu LTS). network_mode: host в docker-compose.yml — без
# docker-бриджа/NAT, $remote_addr здесь = реальный IP клиента.
#
# curve=29 в pq-probe = HelloRetryRequest → x25519 (было, пока это не
# применили); curve=4588 = X25519MLKEM768 согласован (цель issue #453).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name delovoy-park.ru www.delovoy-park.ru;

    ssl_certificate /etc/letsencrypt/live/delovoy-park.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/delovoy-park.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # Первым — гибрид X25519+ML-KEM-768 (как Chrome/Safari 2026); классика
    # (x25519/prime256v1/secp384r1) остаётся для клиентов без PQ-поддержки.
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;

    server_tokens off;
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
