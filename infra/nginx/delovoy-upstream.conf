# Upstream приложения — единственная точка переключения blue-green деплоя.
# Файл живёт в /etc/nginx/conf.d/delovoy-upstream.conf; deploy-bluegreen.sh
# перезаписывает порт (3000 = слот a, 3001 = слот b) и делает reload.
# apply-nginx-vhost.sh НЕ трогает существующий файл (иначе затёр бы активный
# слот); этот образец ставится только при первом применении.
upstream delovoy_app {
    server 127.0.0.1:3000;
    keepalive 32;
}
