# Канонический прод-vhost delovoy-park.ru (источник истины — репозиторий).
#
# До этого файла конфиг существовал только на сервере: heredoc из
# scripts/setup-vps.sh + 3 поколения мутаций (certbot --nginx --redirect,
# apply-nginx-static-archive.sh, ручные правки). Применяется ТОЛЬКО через
# scripts/apply-nginx-vhost.sh (бэкап + nginx -t + автооткат) или workflow
# ops-nginx.yml (diff перед apply обязателен).
#
# Отличия от исторического конфига:
# - keepalive к upstream + map $http_upgrade (константный "Connection: upgrade"
#   закрывал соединение к app на каждый запрос);
# - upstream delovoy_app вынесен в /etc/nginx/conf.d/delovoy-upstream.conf —
#   точка переключения blue-green деплоя (порт 3000/3001);
# - server_tokens off.
#
# issue #453 (ADR 2026-07-23 §I2): TLS теперь терминирует контейнер `edge`
# (nginx:mainline, OpenSSL ≥3.5, ML-KEM) на публичном 443 — см.
# infra/nginx/edge/delovoy-edge.conf. Этот vhost слушает ТОЛЬКО loopback
# 8443 плейн-HTTP; X-Real-IP/X-Forwarded-* берутся из заголовков, которые уже
# проставил edge, а не из $remote_addr (тут это всегда 127.0.0.1 — сам edge).

# WebSocket-совместимый Connection: "upgrade" только когда клиент апгрейдится,
# иначе пусто → keepalive-пул к приложению переиспользуется.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Перфоманс-телеметрия (issue #577): p95/5xx по роутам сейчас нечем
# детектировать — access_log выключен, вручную включать негде (обычный
# combined-формат всё равно не даёт длительности). $uri, а не $request_uri —
# осознанно: $uri не несёт query string, где у magic-link колбэка
# (/api/auth/callback/email?token=...) идёт секретный токен. Длина
# ограничена на случай аномально длинных путей (сканеры/боты) — не защита от
# PII, та уже обеспечена выбором $uri.
map $uri $delovoy_perf_uri {
    "~^(?<u>.{0,200})"  $u;
    default             $uri;
}

log_format delovoy_perf escape=json
    '{'
    '"time":"$time_iso8601",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"method":"$request_method",'
    '"uri":"$delovoy_perf_uri"'
    '}';

server {
    listen 80;
    listen [::]:80;
    server_name delovoy-park.ru www.delovoy-park.ru;

    # Всё на HTTPS (поведение certbot --redirect, теперь явно в конфиге).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Только loopback: публичный 443 теперь у контейнера edge (issue #453).
    # Плейн HTTP — TLS уже снят на edge, второй раз шифровать нечего.
    listen 127.0.0.1:8443;

    server_name delovoy-park.ru www.delovoy-park.ru;

    server_tokens off;
    client_max_body_size 20M;

    # Отдельный файл + logrotate 7д (infra/nginx/delovoy-nginx-perf.logrotate,
    # ставится apply-nginx-vhost.sh) — не смешиваем с combined access_log,
    # которого тут и не было (access_log off по умолчанию).
    access_log /var/log/delovoy-park/nginx-perf.log delovoy_perf;

    location / {
        proxy_pass http://delovoy_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # Доверяем заголовкам от edge, а не $remote_addr — на loopback-хопе
        # $remote_addr всегда 127.0.0.1 (сам edge), реальный клиент виден
        # только в том, что edge уже проставил. 8443 недостижим извне —
        # подменить эти заголовки до edge нельзя.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Security headers (дублируют app-уровень — поведение сохранено как было).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # static-archive: диск (текущий + прошлые билды), фолбэк — app.
    # Маркер "static-archive" важен: apply-nginx-static-archive.sh видит его
    # и становится no-op (иначе перепишет блок заново).
    location /_next/static/ {
        root /opt/delovoy-park/static-archive;
        try_files $uri @next_static_app;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location @next_static_app {
        proxy_pass http://delovoy_app;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Health check — без логов (его дёргают watchdog'и каждую минуту).
    location /api/health {
        proxy_pass http://delovoy_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        access_log off;
    }
}
