# Одноразовое купирование шторма 2026-10-07.
#
# process-outgoing раз в минуту ходит на публичный URL и не оставляет
# SystemEvent. Прогон комментирует только эту строку crontab (бэкап
# /tmp/crontab.delovoy.bak) и снимает висящие curl по PID.
# Очередь, бот, docker и остальные кроны не трогаются. Секреты не печатаются.
name: Ops — Contain notification storm

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [".github/workflows/ops-contain-notif-storm.yml"]

concurrency:
  group: ops-contain-notif-storm
  cancel-in-progress: false

jobs:
  contain:
    name: Pause process-outgoing storm
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Diagnose and pause on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 6m
          script: |
            set -eu
            echo "=== transport ==="
            docker exec delovoy-app node -e '
              const net = require("net");
              const proxy = process.env.TELEGRAM_PROXY_URL || "";
              const root = process.env.TELEGRAM_API_ROOT || "";
              let port = 0, host = "";
              const info = {
                proxy_set: Boolean(proxy),
                root_is_default: root === "" || root === "https://api.telegram.org"
              };
              if (proxy) {
                try {
                  const u = new URL(proxy);
                  host = u.hostname || "";
                  port = Number(u.port || 80);
                  info.proxy_scheme = u.protocol.replace(":", "");
                  info.proxy_port = port;
                } catch (e) { info.proxy_parse = "fail"; }
              }
              console.log(JSON.stringify(info));
              if (!host) process.exit(0);
              const s = net.connect({ host, port, timeout: 5000 });
              const done = (msg) => { console.log(msg); process.exit(0); };
              s.on("connect", () => { s.end(); done("proxy_tcp=open"); });
              s.on("timeout", () => { s.destroy(); done("proxy_tcp=timeout"); });
              s.on("error", (e) => done("proxy_tcp=fail " + (e.code || "error")));
            '

            echo "=== telegram from host ==="
            curl -4 -sS -o /dev/null --max-time 6 -w 'v4 %{http_code}\n' https://api.telegram.org/ || echo "v4 fail"
            curl -6 -sS -o /dev/null --max-time 6 -w 'v6 %{http_code}\n' https://api.telegram.org/ || echo "v6 fail"

            echo "=== pause cron if still active ==="
            crontab -l > /tmp/crontab.delovoy.bak
            python3 - << 'PY'
            import pathlib, subprocess, sys
            raw = pathlib.Path("/tmp/crontab.delovoy.bak").read_text()
            out, changed = [], False
            for line in raw.splitlines():
                if "process-outgoing" in line and not line.lstrip().startswith("#"):
                    out.append("# CONTAIN 2026-10-07: paused — telegram transport dead, batch never finishes")
                    out.append("# " + line)
                    changed = True
                else:
                    out.append(line)
            if changed:
                pathlib.Path("/tmp/crontab.delovoy.new").write_text("\n".join(out) + "\n")
                subprocess.check_call(["crontab", "/tmp/crontab.delovoy.new"])
                print("paused")
            else:
                print("already paused")
            PY

            echo "=== kill only curl pids ==="
            python3 - << 'PY'
            import os, signal
            killed = []
            for pid in os.listdir("/proc"):
                if not pid.isdigit():
                    continue
                try:
                    cmd = open(f"/proc/{pid}/cmdline", "rb").read().replace(b"\x00", b" ").decode("utf-8", "replace")
                except OSError:
                    continue
                if cmd.startswith("curl ") and "process-outgoing" in cmd:
                    os.kill(int(pid), signal.SIGTERM)
                    killed.append(pid)
            print("killed", ",".join(killed) or "none")
            PY

            echo "=== markers ==="
            crontab -l | grep -n 'CONTAIN 2026-10-07' || echo "no contain marker"
            echo "active_lines=$(crontab -l | grep -c 'process-outgoing' || true)"
            echo "commented_lines=$(crontab -l | grep 'process-outgoing' | grep -c '^#' || true)"

            echo "=== settle 75s ==="
            sleep 75
            echo "edge_hits_since_pause=$(docker logs --since 70s delovoy-edge 2>&1 | grep -c 'process-outgoing' || true)"
            echo "app_warns_70s=$(docker logs --since 70s delovoy-app 2>&1 | grep -c 'настроенный транспорт' || true)"
            ps -eo pid,etimes,cmd | grep -F 'process-outgoing' | grep -v grep || echo "no in-flight curls"
