name: Setup Claude Agent (one-time)

on:
  workflow_dispatch:

jobs:
  setup:
    name: Setup agent on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Bootstrap agent workspace
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -e
            WORKSPACE=/opt/claude-agent-workspace
            REPO_URL=https://github.com/aylisrg/Platform-Delovoy.git

            if [ -d "$WORKSPACE/.git" ]; then
              echo "Workspace exists — pulling latest..."
              git -C "$WORKSPACE" pull --ff-only
            else
              echo "Cloning repo into $WORKSPACE..."
              git clone "$REPO_URL" "$WORKSPACE"
            fi

            git -C "$WORKSPACE" config user.name  "Claude Code Agent"
            git -C "$WORKSPACE" config user.email "agent@delovoy-park.ru"
            echo "Workspace ready at $WORKSPACE"

      - name: Claude login — open URL from logs to complete OAuth
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd /opt/delovoy-park
            BROWSER=none docker compose exec -T agent claude login 2>&1

      - name: Restart agent
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 1m
          script: |
            cd /opt/delovoy-park
            docker compose restart agent
            sleep 5
            docker compose logs agent --tail 30
