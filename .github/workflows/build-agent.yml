name: Build & Deploy Agent

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/build-agent.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aylisrg/platform-delovoy-agent

jobs:
  build-and-push:
    name: Build and push agent image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./agent
          file: ./agent/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy agent to Hetzner
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Pull image and restart agent
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AGENT_HETZNER_HOST }}
          username: ${{ secrets.AGENT_HETZNER_USER }}
          key: ${{ secrets.AGENT_HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /opt/delovoy-agent

            echo "${{ secrets.AGENT_GITHUB_PAT }}" \
              | docker login ghcr.io -u aylisrg --password-stdin

            docker compose pull agent
            docker compose up -d agent

            sleep 3
            if docker compose ps agent --format '{{.State}}' | grep -q running; then
              echo "✅ Agent is running"
            else
              echo "❌ Agent failed to start"
              docker compose logs --tail 50 agent
              exit 1
            fi

      - name: Notify on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "text=🚨 Agent deploy FAILED — ${{ github.sha }}" \
            -d "parse_mode=HTML" || true
