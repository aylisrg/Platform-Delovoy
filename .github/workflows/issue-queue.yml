name: Issue Queue — Grooming & Dashboard

# Сопровождение автономной очереди разгрузки бэклога. AI здесь нет вообще —
# это детерминированная уборка, которая должна работать, даже когда воркер мёртв.
#
# Что делает:
#   1. reconcile — снимает протухшие локи auto:wip (сессия воркера умерла, не
#      дойдя до PR), помечает wip issues, у которых PR уже открыт.
#   2. report    — перерисовывает issue-дашборд «что в работе / что дальше /
#      что ждёт владельца».
#
#   3. heartbeat — сторож простоя: исполнитель очереди — смертная интерактивная
#      сессия Claude Code, и если она умерла при непустой очереди, это не видно
#      нигде. Алерт уходит в Telegram, дедуп — маркер-комментарий на дашборде.
#
# Кто делает саму работу: интерактивная сессия Claude Code, которая гоняет
# .claude/commands/next-issue.md. Этот workflow — только ledger и сторож,
# он ничего не чинит в коде.

on:
  schedule:
    - cron: "17 * * * *" # ежечасно, не в :00 — не толкаться с остальными кронами
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: issue-queue
  cancel-in-progress: false

jobs:
  groom:
    name: Reconcile + dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node

      - name: Reconcile queue state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/issue-queue.ts reconcile

      - name: Refresh dashboard issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/issue-queue.ts report

      - name: Show next pick in run summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '## Следующая задача очереди'
            echo '```json'
            npx tsx scripts/issue-queue.ts next
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Решение «пора ли алертить» принимает CLI (после report — дашборд-issue
      # гарантированно существует, на нём живёт дедуп-маркер). Секреты Telegram
      # в CLI не попадают — сам вызов ниже, отдельным шагом.
      - name: Heartbeat — queue idle check
        id: hb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx tsx scripts/issue-queue.ts heartbeat > hb.json
          cat hb.json
          {
            echo "alert=$(jq -r .alert hb.json)"
            echo "ready=$(jq -r .ready hb.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Telegram — queue idle alert
        if: steps.hb.outputs.alert == 'true'
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          READY: ${{ steps.hb.outputs.ready }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram secrets not set — skipping alert"; exit 0
          fi
          TEXT="⏸ <b>Автоочередь простаивает</b>"
          TEXT+=$'\n\n'
          TEXT+="В очереди ${READY} задач(и) auto:ready, в работе никого, PR-активности давно нет."$'\n'
          TEXT+="Сессии воркера запускает Routine «Автоочередь: разбор бэклога» раз в 2 часа."$'\n'
          TEXT+="Раз задач никто не берёт — сломан сам планировщик, а не очередь:"$'\n'
          TEXT+="проверь Routine на claude.ai/settings/routines (включён ли, не падают ли запуски)."$'\n'
          TEXT+="<b>Run:</b> <a href='${RUN_URL}'>лог</a>"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}" \
            -o /dev/null || true

      # Watchdog автономии (issue #573): живость AUTOMATION_TOKEN. Мёртвый или
      # стареющий токен дополнительно заводит pat-rotation decision на сайте —
      # владельцу приходит Telegram-инструкция с кнопкой «Готово» (это
      # единственный его легальный заход в GitHub, ~2 мин раз в 90 дней).
      # Старый суточный дайджест needs-owner убран: hold-PR теперь приходит
      # кнопками в момент навешивания лейбла (decisions-sync свипера), о
      # зависших напоминает вечерний owner-digest.yml.
      - name: Ops watch — AUTOMATION_TOKEN liveness
        id: ops
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          OWNER_DECISIONS_SECRET: ${{ secrets.OWNER_DECISIONS_SECRET }}
        run: |
          npx tsx scripts/issue-queue.ts ops-watch > ops.json
          cat ops.json
          {
            echo "token_alert=$(jq -r '.tokenAlert // false' ops.json)"
            echo "token_status=$(jq -r '.token.status // "n/a"' ops.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Telegram — AUTOMATION_TOKEN мёртв или протух
        if: steps.ops.outputs.token_alert == 'true'
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          STATUS: ${{ steps.ops.outputs.token_status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram secrets not set — skipping alert"; exit 0
          fi
          TEXT="🚨 <b>AUTOMATION_TOKEN мёртв или протух</b> (GET /user → ${STATUS})"
          TEXT+=$'\n\n'
          TEXT+="Авто-ребейзы снова приписываются github-actions[bot] — CI ребейзнутых веток "$'\n'
          TEXT+="паркуется в action_required, ждёт ручного «Approve and run», PR-ы копятся."$'\n'
          TEXT+="Перевыпусти fine-grained PAT (GitHub → Settings → Developer settings → "$'\n'
          TEXT+="Fine-grained tokens) и обнови секрет AUTOMATION_TOKEN в репозитории."$'\n'
          TEXT+="<b>Run:</b> <a href='${RUN_URL}'>лог</a>"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}" \
            -o /dev/null || true

