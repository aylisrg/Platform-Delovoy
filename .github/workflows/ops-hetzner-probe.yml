# Независимая проба сайта с Hetzner-бокса (вторая внешняя точка обзора).
#
# Зачем при живом site-watchdog: GitHub троттлит cron */5 до реальных
# ~50–70 минут, и сам GitHub — единая точка отказа мониторинга. Крон на
# Hetzner ходит каждые 5 минут честно и шлёт алерты в Telegram НАПРЯМУЮ
# (из Германии api.telegram.org доступен без релея) — канал алертов не
# зависит ни от GitHub, ни от VPS, ни от релея.
#
# install кладёт probe-скрипт + /etc/cron.d/delovoy-probe + root-only env
# c токеном/чатом (из production-секретов, в логах замаскированы).
# push-запуск = status (read-only).
name: Ops — Hetzner Site Probe

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Действие"
        type: choice
        options: [status, install, test-alert, remove]
        default: status
  push:
    branches-ignore: [main]
    paths: [".github/workflows/ops-hetzner-probe.yml"]

concurrency:
  group: ops-hetzner-probe
  cancel-in-progress: false

jobs:
  probe:
    name: "Hetzner probe: ${{ inputs.action || 'status (push)' }}"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Применение на Hetzner
        uses: appleboy/ssh-action@v1
        env:
          ACTION: ${{ (github.event_name == 'workflow_dispatch' && inputs.action) || 'status' }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        with:
          host: ${{ secrets.AGENT_HETZNER_HOST }}
          username: ${{ secrets.AGENT_HETZNER_USER }}
          key: ${{ secrets.AGENT_HETZNER_SSH_KEY }}
          command_timeout: 5m
          envs: ACTION,TG_TOKEN,TG_CHAT
          script: |
            set -eu
            SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
            SCRIPT=/usr/local/bin/delovoy-probe.sh
            CRON=/etc/cron.d/delovoy-probe
            ENVF=/etc/delovoy-probe.env

            case "$ACTION" in
              status)
                echo "=== Установлено? ==="
                [ -f "$SCRIPT" ] && echo "скрипт: есть" || echo "скрипт: нет"
                [ -f "$CRON" ] && { echo "cron: есть:"; cat "$CRON"; } || echo "cron: нет"
                $SUDO test -f "$ENVF" && echo "env: есть (содержимое не показываем)" || echo "env: нет"
                echo "=== Состояние ==="
                cat /var/tmp/delovoy-probe.state 2>/dev/null || echo "(state-файла нет)"
                tail -5 /var/tmp/delovoy-probe.log 2>/dev/null || echo "(лога нет)"
                ;;

              install)
                if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
                  echo "::error::TELEGRAM_BOT_TOKEN / TELEGRAM_ADMIN_CHAT_ID не пришли из секретов"; exit 1
                fi
                $SUDO tee "$ENVF" >/dev/null <<EOF
            TG_TOKEN=$TG_TOKEN
            TG_CHAT=$TG_CHAT
            EOF
                $SUDO chmod 600 "$ENVF"

                $SUDO tee "$SCRIPT" >/dev/null <<'EOF'
            #!/bin/sh
            # Проба delovoy-park.ru с Hetzner. 2 фейла подряд -> Telegram-алерт
            # (напрямую, из DE релей не нужен), recovery-сообщение при подъёме,
            # cooldown 30 мин, state в /var/tmp. Ставится ops-hetzner-probe.yml.
            set -u
            . /etc/delovoy-probe.env
            SITE="https://delovoy-park.ru"
            STATE=/var/tmp/delovoy-probe.state
            LOG=/var/tmp/delovoy-probe.log
            COOLDOWN=1800

            now() { date +%s; }
            log() { echo "$(date -u '+%F %T') $1" >> "$LOG"; tail -n 200 "$LOG" > "$LOG.t" && mv "$LOG.t" "$LOG"; }
            tg() {
              curl -s -o /dev/null --max-time 15 -X POST \
                "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -d "chat_id=${TG_CHAT}" -d "parse_mode=HTML" \
                --data-urlencode "text=$1" || true
            }

            H=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$SITE/api/health" 2>/dev/null || echo 000)
            HOME=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$SITE/" 2>/dev/null || echo 000)
            OK=false
            [ "$H" = "200" ] && [ "$HOME" = "200" ] && OK=true

            FAILS=0; DOWN_SINCE=0; LAST_ALERT=0
            [ -f "$STATE" ] && . "$STATE"

            if [ "$OK" = "true" ]; then
              if [ "${DOWN_SINCE:-0}" != "0" ]; then
                tg "✅ <b>Hetzner-probe:</b> delovoy-park.ru снова доступен (health=$H, home=$HOME)."
                log "recovered health=$H home=$HOME"
              fi
              printf 'FAILS=0\nDOWN_SINCE=0\nLAST_ALERT=%s\n' "${LAST_ALERT:-0}" > "$STATE"
              exit 0
            fi

            FAILS=$((FAILS + 1))
            log "fail #$FAILS health=$H home=$HOME"
            if [ "$FAILS" -ge 2 ]; then
              NOW=$(now)
              [ "${DOWN_SINCE:-0}" = "0" ] && DOWN_SINCE=$NOW
              if [ $((NOW - ${LAST_ALERT:-0})) -ge $COOLDOWN ]; then
                tg "🚨 <b>Hetzner-probe:</b> delovoy-park.ru НЕДОСТУПЕН со второй внешней точки (health=$H, home=$HOME, фейлов подряд: $FAILS). Site Watchdog в Actions может ещё не сработать (троттлинг cron)."
                LAST_ALERT=$NOW
              fi
            fi
            printf 'FAILS=%s\nDOWN_SINCE=%s\nLAST_ALERT=%s\n' "$FAILS" "${DOWN_SINCE:-0}" "${LAST_ALERT:-0}" > "$STATE"
            EOF
                $SUDO chmod 755 "$SCRIPT"

                echo "*/5 * * * * root /usr/local/bin/delovoy-probe.sh >/dev/null 2>&1" | $SUDO tee "$CRON" >/dev/null
                $SUDO chmod 644 "$CRON"
                echo "✅ Установлено: $SCRIPT + $CRON (каждые 5 минут)"
                $SUDO "$SCRIPT" && echo "Первый прогон прошёл" || true
                cat /var/tmp/delovoy-probe.state 2>/dev/null || true
                ;;

              test-alert)
                $SUDO test -f "$ENVF" || { echo "::error::Сначала install"; exit 1; }
                $SUDO sh -c ". $ENVF && curl -s -o /dev/null -w 'sendMessage: HTTP=%{http_code}\n' --max-time 15 -X POST \"https://api.telegram.org/bot\${TG_TOKEN}/sendMessage\" -d \"chat_id=\${TG_CHAT}\" --data-urlencode 'text=🔧 Hetzner-probe: тестовый алерт — вторая точка мониторинга на связи.'"
                ;;

              remove)
                $SUDO rm -f "$CRON" "$SCRIPT" "$ENVF" /var/tmp/delovoy-probe.state /var/tmp/delovoy-probe.log
                echo "🗑 Проба удалена"
                ;;
            esac
