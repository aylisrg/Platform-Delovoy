name: "Hetzner: Fix SSH access via rescue mode"

# Boots server into Hetzner rescue mode (our SSH key accepted there),
# mounts main disk, injects our public key into authorized_keys, reboots.

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Enable rescue mode and reboot
        run: |
          SERVER_ID=132536346
          PUB_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsUJZMzpKY84gJDYrCbykz/k9ZaV+Ut4uLnnYIP4PPX claude-agent@delovoy-park.ru"

          # Find our SSH key ID in Hetzner
          ALL_KEYS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.HETZNER_API_TOKEN }}" \
            "https://api.hetzner.cloud/v1/ssh_keys?per_page=50")
          KEY_ID=$(echo "$ALL_KEYS" | jq -r --arg pk "$PUB_KEY" \
            '.ssh_keys[] | select(.public_key | startswith($pk | split(" ")[0:2] | join(" "))) | .id' | head -1)

          if [ -z "$KEY_ID" ] || [ "$KEY_ID" = "null" ]; then
            echo "Key not found in Hetzner, creating..."
            RESP=$(curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.HETZNER_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"claude-agent-rescue\",\"public_key\":\"$PUB_KEY\"}" \
              "https://api.hetzner.cloud/v1/ssh_keys")
            KEY_ID=$(echo "$RESP" | jq '.ssh_key.id')
            echo "Created key id=$KEY_ID"
          else
            echo "Found existing key id=$KEY_ID"
          fi

          # Enable rescue mode (linux64) with our SSH key
          RESCUE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.HETZNER_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"linux64\",\"ssh_keys\":[$KEY_ID]}" \
            "https://api.hetzner.cloud/v1/servers/$SERVER_ID/actions/enable_rescue")
          echo "Rescue response: $(echo $RESCUE | jq -c '{action: .action.status, error: .action.error}')"
          if echo "$RESCUE" | jq -e '.action.error != null' > /dev/null 2>&1; then
            echo "::error::Failed to enable rescue: $RESCUE"; exit 1
          fi

          # Reboot into rescue
          REBOOT=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.HETZNER_API_TOKEN }}" \
            "https://api.hetzner.cloud/v1/servers/$SERVER_ID/actions/reboot")
          echo "Reboot: $(echo $REBOOT | jq -c '{status: .action.status}')"

          echo "Waiting 60s for rescue system to boot..."
          sleep 60

      - name: Inject authorized_keys via rescue mode
        run: |
          echo "${{ secrets.AGENT_HETZNER_SSH_KEY }}" > /tmp/key && chmod 600 /tmp/key
          PUB_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsUJZMzpKY84gJDYrCbykz/k9ZaV+Ut4uLnnYIP4PPX claude-agent@delovoy-park.ru"

          ssh -i /tmp/key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            root@178.105.195.243 "
            echo '=== In rescue mode ==='
            lsblk -o NAME,SIZE,TYPE,MOUNTPOINT

            # Find first disk partition (skip rescue tmpfs)
            PART=\$(lsblk -rno NAME,TYPE | awk '\$2==\"part\"{print \$1; exit}')
            if [ -z \"\$PART\" ]; then
              PART=\$(lsblk -rno NAME,TYPE | awk '\$2==\"disk\"{print \$1; exit}')
            fi
            echo \"Mounting /dev/\$PART...\"
            mkdir -p /mnt/main
            mount /dev/\$PART /mnt/main

            echo \"Injecting SSH key...\"
            mkdir -p /mnt/main/root/.ssh
            chmod 700 /mnt/main/root/.ssh
            echo \"$PUB_KEY\" > /mnt/main/root/.ssh/authorized_keys
            chmod 600 /mnt/main/root/.ssh/authorized_keys
            cat /mnt/main/root/.ssh/authorized_keys
            umount /mnt/main

            echo 'Done. Rebooting to normal...'
            reboot
          "

          echo "Waiting 45s for normal boot..."
          sleep 45

      - name: Verify SSH access
        run: |
          echo "${{ secrets.AGENT_HETZNER_SSH_KEY }}" > /tmp/key && chmod 600 /tmp/key
          ssh -i /tmp/key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            root@178.105.195.243 "echo '✓ SSH works on normal boot!'"
