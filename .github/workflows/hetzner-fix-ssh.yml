name: "Hetzner: Fix SSH access (one-shot)"

# Rebuilds the server (reinstalls Ubuntu 24.04 + applies our SSH key).
# After this runs, provision-hetzner-agent.yml full-setup can proceed.

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Find SSH key on Hetzner and rebuild server
        run: |
          SERVER_ID=132536346
          PUB_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsUJZMzpKY84gJDYrCbykz/k9ZaV+Ut4uLnnYIP4PPX claude-agent@delovoy-park.ru"
          KEY_NAME="claude-agent-fix"

          # Find or create the SSH key on Hetzner
          EXISTING=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.HETZNER_API_TOKEN }}" \
            "https://api.hetzner.cloud/v1/ssh_keys?name=$KEY_NAME" \
            | jq '.ssh_keys[0].id // empty')

          if [ -n "$EXISTING" ]; then
            KEY_ID=$EXISTING
            echo "Using existing key id=$KEY_ID"
          else
            RESP=$(curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.HETZNER_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$KEY_NAME\",\"public_key\":\"$PUB_KEY\"}" \
              "https://api.hetzner.cloud/v1/ssh_keys")
            KEY_ID=$(echo "$RESP" | jq '.ssh_key.id')
            echo "Created key id=$KEY_ID, response: $RESP"
          fi

          # Rebuild server = reinstall Ubuntu 24.04 + apply SSH key
          REBUILD=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.HETZNER_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"ubuntu-24.04\",\"ssh_keys\":[$KEY_ID]}" \
            "https://api.hetzner.cloud/v1/servers/$SERVER_ID/actions/rebuild")
          echo "Rebuild response: $REBUILD"

          if echo "$REBUILD" | jq -e '.error' > /dev/null 2>&1; then
            echo "::error::$(echo "$REBUILD" | jq -r '.error.message')"
            exit 1
          fi

          echo "✓ Rebuild started. Waiting 90s for server to come back up..."
          sleep 90

      - name: Verify SSH access
        run: |
          echo "${{ secrets.AGENT_HETZNER_SSH_KEY }}" > /tmp/key && chmod 600 /tmp/key
          ssh -i /tmp/key -o StrictHostKeyChecking=no root@178.105.195.243 "echo '✓ SSH works!'"
