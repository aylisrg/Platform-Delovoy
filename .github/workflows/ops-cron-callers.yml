# Read-only: кто вызывает cron-роуты (Refs #1084).
# Печатает ТОЛЬКО числа, имена роутов, HTTP-статусы и первый токен User-Agent.
# Никогда не печатает строки crontab, unit-файлов, логов, IP, query, заголовки, .env.
# Ничего не меняет на сервере. (c) только host:port и route из crontab, (d) только счётчики из docker logs app.
name: Ops Cron Callers

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Окно docker logs для app (например 2h, 30m)"
        required: false
        default: "2h"

permissions:
  contents: read

concurrency:
  group: ops-cron-callers
  cancel-in-progress: false

jobs:
  callers:
    name: Вызывающие cron-роутов (read-only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Счётчики по crontab, systemd и nginx access log
        env:
          SINCE: ${{ inputs.since }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 8m
          envs: SINCE
          script: |
            set -euo pipefail
            SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo -n"
            ROUTES="avito-account-sync avito-messenger-poll avito-reviews-sync avito-stats-sync inventory no-show ps-park/auto-complete process-outgoing payments-reconcile notifications rental-payment-reminders overdue-session-reminders process-recurring"
            TMP=$(mktemp -d); trap 'rm -rf "$TMP"' EXIT
            die() { echo "::error::$1" >&2; exit 1; }
            if [ -n "$SUDO" ]; then sudo -n true 2>/dev/null || die "sudo -n unavailable"; fi
            # Проверка существования от root (sudo уже проверен): 0 = есть, иначе отсутствует.
            ex() { $SUDO test "$@" 2>/dev/null; }

            # Читает файл в буфер источника. Отсутствие файла не ошибка, ошибка чтения = exit 1.
            add_file() { # $1 буфер, $2 файл
              ex -f "$2" || return 0
              $SUDO cat -- "$2" >> "$TMP/$1" 2>/dev/null || die "read failed: $2"
              printf '\n' >> "$TMP/$1"
            }
            # Число строк с /api/cron/<route>. grep: 0 = есть, 1 = нет совпадений (ок), 2 = ошибка.
            cnt() { # $1 route, $2 буфер
              local n rc=0
              n=$(grep -cE "/api/cron/$1([^a-z/-]|\$)" "$TMP/$2") || rc=$?
              [ "$rc" -le 1 ] || die "grep failed on $2"
              echo "${n:-0}"
            }
            for B in root_ct spool etc_cron systemd_units timers; do : > "$TMP/$B"; done

            # 1. root crontab
            rc=0; $SUDO crontab -l -u root > "$TMP/root_ct" 2> "$TMP/err" || rc=$?
            if [ "$rc" -ne 0 ]; then
              grep -qi 'no crontab' "$TMP/err" && { : > "$TMP/root_ct"; echo "note: root crontab absent"; } || die "read failed: crontab -l -u root"
            fi
            # 2. /var/spool/cron/crontabs/* (все пользователи)
            if ex -d /var/spool/cron/crontabs; then
              LIST=$($SUDO find /var/spool/cron/crontabs -maxdepth 1 -type f 2>/dev/null) || die "read failed: list /var/spool/cron/crontabs"
              for F in $LIST; do add_file spool "$F"; done
              echo "spool_crontab_files: $(printf '%s' "$LIST" | grep -c . || true)"
            else echo "note: /var/spool/cron/crontabs absent"; fi
            # 3. /etc/crontab, /etc/cron.d, /etc/cron.{hourly,daily,weekly,monthly}
            add_file etc_cron /etc/crontab
            for D in /etc/cron.d /etc/cron.hourly /etc/cron.daily /etc/cron.weekly /etc/cron.monthly; do
              if ex -d "$D"; then
                LIST=$($SUDO find "$D" -maxdepth 1 -type f 2>/dev/null) || die "read failed: list $D"
                for F in $LIST; do add_file etc_cron "$F"; done
              else echo "note: $D absent"; fi
            done
            # 4. systemd unit files
            SYSD_DIRS="/etc/systemd /usr/lib/systemd"
            # usrmerge: /lib/systemd часто тот же каталог, что /usr/lib/systemd.
            if ex -d /lib/systemd; then
              if [ "$(readlink -f /lib/systemd)" = "$(readlink -f /usr/lib/systemd)" ]; then echo "note: /lib/systemd = /usr/lib/systemd (usrmerge), skipped"; else SYSD_DIRS="$SYSD_DIRS /lib/systemd"; fi
            fi
            for D in $SYSD_DIRS; do
              if ex -d "$D"; then
                LIST=$($SUDO find "$D" -type f \( -name '*.service' -o -name '*.timer' \) 2>/dev/null) || die "read failed: list $D"
                for F in $LIST; do add_file systemd_units "$F"; done
              else echo "note: $D absent"; fi
            done
            # 5. systemctl list-timers --all
            if command -v systemctl >/dev/null; then
              $SUDO systemctl list-timers --all --no-pager > "$TMP/timers" 2>/dev/null || die "read failed: systemctl list-timers"
            else echo "note: systemctl absent"; fi

            echo "=== (a) источники расписания (только числа) ==="
            printf '%-28s %6s %6s %8s %8s %7s\n' route root spool etc_cron sysd_unit timers
            for R in $ROUTES; do
              # Присваивания, чтобы ошибка cnt в subshell обрывала скрипт (set -e).
              a=$(cnt "$R" root_ct); b=$(cnt "$R" spool); c=$(cnt "$R" etc_cron); d=$(cnt "$R" systemd_units); e=$(cnt "$R" timers)
              printf '%-28s %6s %6s %8s %8s %7s\n' "$R" "$a" "$b" "$c" "$d" "$e"
            done

            echo "=== (b) nginx access log, 7 дней ==="
            : > "$TMP/log"
            FILES=""
            if ex -d /var/log/nginx; then
              FILES=$($SUDO find /var/log/nginx -maxdepth 2 -type f -name '*access*' -mtime -7 2>/dev/null | sort) || die "read failed: list /var/log/nginx"
            fi
            if [ -n "$FILES" ]; then
              echo "source: /var/log/nginx, files: $(printf '%s\n' "$FILES" | wc -l)"
              for F in $FILES; do
                case "$F" in
                  *.gz) $SUDO zcat -f -- "$F" >> "$TMP/log" 2>/dev/null || die "read failed: $F" ;;
                  *)    $SUDO cat -- "$F" >> "$TMP/log" 2>/dev/null || die "read failed: $F" ;;
                esac
              done
            else
              echo "note: no access logs in /var/log/nginx, trying docker"
              command -v docker >/dev/null || die "no nginx access logs and docker absent"
              PS=$($SUDO docker ps --format '{{.Names}} {{.Image}}' 2>/dev/null) || die "read failed: docker ps"
              CS=$(printf '%s\n' "$PS" | awk 'tolower($0) ~ /nginx/ {print $1}')
              [ -n "$CS" ] || die "no nginx access logs and no nginx container"
              echo "source: docker, containers: $(printf '%s\n' "$CS" | wc -l)"
              for C in $CS; do
                $SUDO docker logs --since 168h "$C" >> "$TMP/log" 2>/dev/null || die "read failed: docker logs (container $C)"
              done
            fi
            [ -s "$TMP/log" ] || die "no access log lines"
            echo "log_lines_total: $(wc -l < "$TMP/log")"
            # Печатаем только route, статус, первый токен UA.
            awk -F'"' -v routes="$ROUTES" '
              BEGIN { n = split(routes, rr, " ") }
              {
                split($2, req, " "); p = req[2]; sub(/\?.*/, "", p)
                if (p !~ /^\/api\/cron\//) next
                r = substr(p, 11); sub(/\/$/, "", r)
                hit = 0; for (i = 1; i <= n; i++) if (r == rr[i]) hit = 1
                if (!hit) next
                split($3, s, " "); st = s[1]; if (st !~ /^[0-9][0-9][0-9]$/) st = "???"
                ua = $6; sub(/^[ \t]+/, "", ua); sub(/[\/ ].*$/, "", ua)
                gsub(/[^A-Za-z0-9._-]/, "", ua); if (ua == "") ua = "-"
                print r "\tstatus=" st "\tua=" substr(ua, 1, 40)
              }' "$TMP/log" > "$TMP/agg" || die "parse failed"
            if [ -s "$TMP/agg" ]; then sort "$TMP/agg" | uniq -c | sort -k2,2 -k1,1nr; else echo "cron_route_requests: 0"; fi
            echo "=== (c) цели crontab: только host:port и route ==="
            # Без заголовков, query и секретов: печатаем только host:port из URL и имя роута.
            cat "$TMP/root_ct" "$TMP/spool" "$TMP/etc_cron" \
              | grep -oE 'https?://[A-Za-z0-9.-]+(:[0-9]+)?/api/cron/[a-z/-]+' \
              | sed -E 's#^https?://##; s#/api/cron/# #; s#/$##' \
              | sort | uniq -c || echo "crontab_cron_urls: 0"

            echo "=== (d) app container logs (delovoy-app), окно ${SINCE:-2h} ==="
            SINCE_V="${SINCE:-2h}"
            case "$SINCE_V" in *[!0-9smhd]*|"") die "bad since input" ;; esac
            command -v docker >/dev/null || die "docker absent"
            $SUDO docker logs --since "$SINCE_V" delovoy-app > "$TMP/app" 2>&1 || die "read failed: docker logs delovoy-app"
            echo "app_log_lines_total: $(wc -l < "$TMP/app")"
            # App не пишет access-строки для /api/cron (Next standalone без request-лога),
            # 401/503 из cron-auth не логируются. Считаем то, что логируется.
            echo "app_access_lines_api_cron: $(grep -cE '(GET|POST) /api/cron/' "$TMP/app" || true)"
            echo "-- NEXTAUTH_SECRET fallback (#1084) по роуту:"
            grep -F '[cron-auth]' "$TMP/app" | grep -F 'NEXTAUTH_SECRET' \
              | sed -E 's/.*\[cron-auth\] ([A-Za-z0-9/_-]+):.*/\1/' | sort | uniq -c || echo "  0"
            echo "nextauth_fallback_total: $(grep -F '[cron-auth]' "$TMP/app" | grep -cF 'NEXTAUTH_SECRET' || true)"
            echo "-- ошибки cron-джобов по роуту:"
            grep -oE '\[cron/[A-Za-z0-9/_-]+\]' "$TMP/app" | sort | uniq -c || echo "  0"
            echo "=== конец ==="
