name: CI — Lint, Test, Build

on:
  pull_request:
    branches: [main]
    # No paths-ignore on PRs — required checks must always report
    # so branch protection doesn't block docs-only or release PRs
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/platform-delovoy

jobs:
  # Gate jobs (lint/test/typecheck/security) run on PRs only.
  # Branch protection requires them before merge — re-running on the merge commit
  # is redundant and costs ~5-8 min per release. Main push runs only `build`.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: npm run lint

  # Отдельная быстрая джоба (--ignore-scripts, без установки остальных джоб):
  # даёт независимый и самый ранний сигнал о рассинхроне package.json ↔
  # package-lock.json (issue #445), не дожидаясь более тяжёлых lint/test/build.
  # setup-node сам тоже теперь ставит зависимости через `npm ci` (issue #464),
  # так что рассинхрон больше не проходит незамеченным ни в одной джобе — эта
  # осталась ради скорости фидбека, а не как единственная защита.
  lockfile:
    name: Lockfile in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: npm ci (падает при рассинхроне package.json ↔ package-lock.json)
        run: npm ci --ignore-scripts --no-audit --no-fund

  # Отчёт AC → тест для PR, ссылающихся на PRD (issue #585). Режим отчёта:
  # скрипт сам никогда не завершается с ошибкой (см. eval/traceability-report.ts),
  # continue-on-error — дополнительная страховка на время стабилизации.
  # Решение сделать проверку блокирующей — отдельным изменением после 2-3 фич.
  ac-traceability:
    name: AC-трассируемость (отчёт)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: git fetch origin "${{ github.base_ref }}" --depth=1
      - name: Report AC coverage in step summary
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: npx tsx eval/traceability-report.ts

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: npm test
      - name: Cron upsert test (#1074)
        run: bash scripts/__tests__/cron-upsert.test.sh

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: npx tsc --noEmit

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # Критические флоу против живого стека (issue #572): роутинг, RSC-границы,
  # реальные Prisma-запросы и битые клиентские бандлы не проверяет ни один
  # другой job — unit-тесты мокают DB/Redis, build только компилирует.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: delovoy
          POSTGRES_PASSWORD: delovoy_secret
          POSTGRES_DB: delovoy_park
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delovoy -d delovoy_park"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://delovoy:delovoy_secret@localhost:5432/delovoy_park
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: e2e-ci-secret-not-for-prod-use
      AUTH_SECRET: e2e-ci-secret-not-for-prod-use
      DEV_OVERLAY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      # `prisma migrate deploy` — не `db push` — было бы правильнее, но
      # миграционная история сейчас расходится со схемой на пустой БД
      # (issue #590, отдельный P1: минимум 4 таблицы не создаются fresh
      # migrate deploy). Прод это не задевает (там уже накопленное годами
      # состояние), а для одноразовой сервис-БД CI `db push` даёт ровно то
      # же дерево таблиц, без риска для прода. Вернуть на migrate deploy
      # после починки #590.
      - name: Sync schema (db push — see #590)
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Seed reference data + dev test accounts
        run: npx tsx scripts/seed.ts

      - name: Build (standalone + static assets)
        run: npm run build:e2e

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # reporter: "github" (playwright.config.ts) не пишет playwright-report/ —
      # только терминальные аннотации. Без этого артефакта actual/diff/previous
      # PNG для упавшего toHaveScreenshot недостижимы после завершения job'ы.
      - name: Upload E2E failure diagnostics (actual/diff screenshots, traces)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, typecheck]
    # Run when upstream gates pass (PR) OR when they were skipped (main push).
    # `!failure() && !cancelled()` treats "skipped" as satisfied.
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On main push: build once and push sha-tagged image.
      # Staging and production jobs retag this image — no rebuilds needed.
      - name: Build and push sha image (main)
        id: build_push_main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      # GHCR intermittently returns a transient secondary rate limit or a
      # broken push/pull stream (see issue #689: 4 ci-failure incidents in 7
      # days, all self-healing on the next merge). One retry after a short
      # backoff clears it without needing a manual re-run.
      - name: Wait before push retry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.build_push_main.outcome == 'failure'
        run: sleep 30

      - name: Build and push sha image (main) — retry on transient GHCR error
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.build_push_main.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      # On PRs: build locally only — no push needed, just validate the image builds.
      - name: Build image locally (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: platform-delovoy:ci-${{ github.sha }}

      - name: Scan image with Trivy (main — from GHCR)
        id: trivy_main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          timeout: 5m

      # Same GHCR flakiness as the push step above (issue #689) — Trivy pulls
      # the just-pushed image back down to scan it, and that pull can hit the
      # same transient stream/rate-limit error (observed: HTTP/2 PROTOCOL_ERROR).
      - name: Wait before Trivy retry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.trivy_main.outcome == 'failure'
        run: sleep 20

      - name: Scan image with Trivy (main — from GHCR) — retry on transient error
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.trivy_main.outcome == 'failure'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          timeout: 5m

      - name: Scan image with Trivy (PR — local)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: platform-delovoy:ci-${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          timeout: 5m

  # Failure notifications are handled by ci-watchdog.yml (richer format, per-job detail).
