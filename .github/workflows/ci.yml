name: CI — Lint, Test, Build

on:
  pull_request:
    branches: [main]
    # No paths-ignore on PRs — required checks must always report
    # so branch protection doesn't block docs-only or release PRs
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/platform-delovoy

permissions:
  contents: read

jobs:
  # Gate jobs (lint/test/typecheck/e2e/migrations-drift) run on PRs only.
  # Branch protection requires them before merge — re-running on the merge commit
  # is redundant and costs ~5-8 min per release. Main push runs only `build`.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: npm test
      - name: Deployment backup failure gates
        run: bash scripts/__tests__/deploy-backup.test.sh
      - name: Cron upsert test (#1074)
        run: bash scripts/__tests__/cron-upsert.test.sh
      - name: TLS edge deploy-hook safety gates
        run: bash scripts/__tests__/certbot-edge-hook.test.sh

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - name: App (src/)
        run: npx tsc --noEmit
      - name: Telegram bot (bot/)
        run: npx tsc --noEmit -p tsconfig.bot.json

  # Миграции == schema.prisma (issue #590). Прогоняет всю историю
  # prisma/migrations на пустой shadow-БД и сравнивает со схемой. Любое
  # расхождение (таблица через db push без migration.sql и т.п.) роняет job.
  migrations-drift:
    name: Prisma migrations match schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: delovoy
          POSTGRES_PASSWORD: delovoy_secret
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delovoy -d shadow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - name: prisma migrate diff (migrations -> schema)
        run: |
          set +e
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://delovoy:delovoy_secret@localhost:5432/shadow \
            --script --exit-code > drift.sql
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::error::prisma/migrations расходятся с schema.prisma. Создайте миграцию: npx prisma migrate dev --create-only"
            cat drift.sql
            exit 1
          fi
          exit $code

  # Критические флоу против живого стека (issue #572): роутинг, RSC-границы,
  # реальные Prisma-запросы и битые клиентские бандлы не проверяет ни один
  # другой job — unit-тесты мокают DB/Redis, build только компилирует.
  e2e:
    name: E2E (Playwright)
    # Match the Playwright noble image; do not follow ubuntu-latest OS upgrades.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: delovoy
          POSTGRES_PASSWORD: delovoy_secret
          POSTGRES_DB: delovoy_park
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delovoy -d delovoy_park"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://delovoy:delovoy_secret@localhost:5432/delovoy_park
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: e2e-ci-secret-not-for-prod-use
      AUTH_SECRET: e2e-ci-secret-not-for-prod-use
      DEV_OVERLAY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      # Чистая БД + migrate deploy: тот же путь, что disaster recovery (#590).
      - name: Apply migrations (migrate deploy)
        run: npx prisma migrate deploy

      - name: Seed reference data + dev test accounts
        run: npx tsx scripts/seed.ts

      - name: Build (standalone + static assets)
        run: npm run build:e2e

      # Browser + OS libraries are already installed in the official image.
      # No apt mirror dependency on each run; npm ci pins the matching version.
      - name: Pull matching Playwright image
        run: |
          playwright_version="$(node -p 'require("@playwright/test/package.json").version')"
          playwright_image="mcr.microsoft.com/playwright:v${playwright_version}-noble"
          docker pull "$playwright_image"
          echo "PLAYWRIGHT_IMAGE=$playwright_image" >> "$GITHUB_ENV"

      - name: Run E2E tests
        # Host networking preserves loopback-only DB/Redis and payment fixtures.
        # Same paths and UID keep annotations and uploaded diagnostics usable.
        run: |
          docker run --rm --init --ipc=host --network=host \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            --env HOME=/tmp --env HOSTNAME=127.0.0.1 \
            --env CI --env GITHUB_ACTIONS --env GITHUB_WORKSPACE \
            --env DATABASE_URL --env REDIS_URL \
            --env NEXTAUTH_URL --env NEXTAUTH_SECRET --env AUTH_SECRET \
            --env DEV_OVERLAY \
            "$PLAYWRIGHT_IMAGE" npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # reporter: "github" (playwright.config.ts) не пишет playwright-report/ —
      # только терминальные аннотации. Без этого артефакта actual/diff/previous
      # PNG для упавшего toHaveScreenshot недостижимы после завершения job'ы.
      - name: Upload E2E failure diagnostics (actual/diff screenshots, traces)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, typecheck]
    # Run when upstream gates pass (PR) OR when they were skipped (main push).
    # `!failure() && !cancelled()` treats "skipped" as satisfied.
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On main push: build once and push sha-tagged image.
      # Staging and production jobs retag this image — no rebuilds needed.
      - name: Build and push sha image (main)
        id: build_push_main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      # GHCR intermittently returns a transient secondary rate limit or a
      # broken push/pull stream (see issue #689: 4 ci-failure incidents in 7
      # days, all self-healing on the next merge). One retry after a short
      # backoff clears it without needing a manual re-run.
      - name: Wait before push retry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.build_push_main.outcome == 'failure'
        run: sleep 30

      - name: Build and push sha image (main) — retry on transient GHCR error
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.build_push_main.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      # On PRs: build locally only — no push needed, just validate the image builds.
      - name: Build image locally (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: platform-delovoy:ci-${{ github.sha }}
