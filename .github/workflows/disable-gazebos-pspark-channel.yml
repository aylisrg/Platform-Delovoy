# One-shot: останавливает уведомления в общий Telegram-канал
# "Delovoy-Admin-Беседки-Плейст-бронь" для gazebos + ps-park — оба механизма
# (admin routing chat: Module.config.telegramAdminChatEnabled; выделенный
# канал модуля: Module.config.telegramChannelEnabled), не трогая сохранённые
# chat ID/токены — обратимо через /admin/monitoring («Тест каналов
# уведомлений») без повторного ввода chat ID.
#
# Прямой psql через SSH (паттерн из infra-audit.yml #vps-audit) — не зависит
# от передеплоя app-образа, действует сразу после дозагрузки workflow.
# Идемпотентно — безопасно перезапускать.
#
# Trigger: gh workflow run "Disable gazebos/ps-park Telegram channel (one-shot)"
name: Disable gazebos/ps-park Telegram channel (one-shot)

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [".github/workflows/disable-gazebos-pspark-channel.yml"]

concurrency:
  group: disable-gazebos-pspark-channel
  cancel-in-progress: false

jobs:
  disable:
    name: Отключить оба механизма для gazebos + ps-park
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Сухой прогон при push на не-main ветку
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Сухой прогон (push): изменений не будет. Запускайте через workflow_dispatch."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Выключить telegramAdminChatEnabled + telegramChannelEnabled через psql
        if: steps.gate.outputs.proceed == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo "=== До изменения ==="
            docker exec delovoy-postgres psql -U delovoy -d delovoy_park -Atc \
              'SELECT slug, config->>$$telegramAdminChatEnabled$$ AS admin_chat_enabled, config->>$$telegramChannelEnabled$$ AS module_channel_enabled FROM "Module" WHERE slug IN ($$gazebos$$, $$ps-park$$);'

            docker exec delovoy-postgres psql -U delovoy -d delovoy_park -Atc \
              'UPDATE "Module" SET config = COALESCE(config, $${}$$::jsonb) || $${"telegramAdminChatEnabled": false, "telegramChannelEnabled": false}$$::jsonb WHERE slug IN ($$gazebos$$, $$ps-park$$);'

            echo "=== После изменения ==="
            docker exec delovoy-postgres psql -U delovoy -d delovoy_park -Atc \
              'SELECT slug, config->>$$telegramAdminChatEnabled$$ AS admin_chat_enabled, config->>$$telegramChannelEnabled$$ AS module_channel_enabled FROM "Module" WHERE slug IN ($$gazebos$$, $$ps-park$$);'

      - name: Notify
        if: always() && steps.gate.outputs.proceed == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            TEXT="✅ Канал Беседки/Плей Парк отключён (admin chat + module channel) — обратимо через /admin/monitoring"
          else
            TEXT="🚨 Не удалось отключить канал Беседки/Плей Парк — см. лог workflow"
          fi
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "text=${TEXT}" \
            -d "parse_mode=HTML" || true
