# Управление прод-vhost'ом nginx из репозитория (infra/nginx/).
#
# Живой конфиг на сервере — 3 поколения неревьюженных мутаций (heredoc
# провижена + certbot --nginx --redirect + apply-nginx-static-archive.sh),
# поэтому diff перед apply ОБЯЗАТЕЛЕН: смотрим глазами, что именно заменяем.
# apply идёт через scripts/apply-nginx-vhost.sh (бэкап, nginx -t, автооткат)
# и завершается внешней проверкой: HTTP/2 + 200 + живой /_next/static-чанк.
#
# issue #453 (ADR 2026-07-23 §I2): host-nginx больше не держит публичный
# :443 напрямую — TLS (с ML-KEM) терминирует контейнер `edge`
# (nginx:mainline), host-nginx слушает только loopback :8443. apply теперь
# двухшаговый (host-nginx → loopback, потом edge → публичный :443) с
# собственным автооткатом на случай если edge не поднимется; rollback
# сначала останавливает edge (иначе host-nginx не сможет забиндиться
# обратно на занятый порт), потом восстанавливает бэкап.
#
# push-триггер регистрирует workflow до мержа; push-запуск = diff (read-only).
name: Ops — Nginx vhost

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Действие"
        type: choice
        options: [diff, apply, rollback]
        default: diff
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/ops-nginx.yml"
      - "infra/nginx/**"
      - "scripts/apply-nginx-vhost.sh"
      - "docker-compose.prod.yml"

concurrency:
  group: ops-nginx
  cancel-in-progress: false

env:
  ACTION: ${{ (github.event_name == 'workflow_dispatch' && inputs.action) || 'diff' }}

jobs:
  diff:
    name: "Diff: живой конфиг vs репозиторий"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Забрать живые конфиги и сравнить
        run: |
          set -u
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/ops_key
          chmod 600 ~/.ssh/ops_key
          vps() {
            ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/ops_key \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "$1" 2>/dev/null || true
          }
          vps "sudo cat /etc/nginx/sites-available/delovoy-park" > /tmp/live-vhost.conf
          vps "sudo cat /etc/nginx/conf.d/delovoy-upstream.conf" > /tmp/live-upstream.conf
          vps "cat /opt/delovoy-park/infra/nginx/edge/delovoy-edge.conf" > /tmp/live-edge.conf
          vps "docker inspect -f '{{.State.Status}}' delovoy-edge" > /tmp/live-edge-state.txt
          rm -f ~/.ssh/ops_key

          {
            echo "## nginx diff (live → repo)"
            echo ""
            echo "### vhost: /etc/nginx/sites-available/delovoy-park"
            echo '```diff'
            if [ -s /tmp/live-vhost.conf ]; then
              diff -u /tmp/live-vhost.conf infra/nginx/delovoy-park.conf || true
            else
              echo "(живой vhost пуст/не прочитан — apply установит репо-версию с нуля)"
            fi
            echo '```'
            echo "### upstream: /etc/nginx/conf.d/delovoy-upstream.conf"
            echo '```diff'
            if [ -s /tmp/live-upstream.conf ]; then
              diff -u /tmp/live-upstream.conf infra/nginx/delovoy-upstream.conf || true
              echo "(существующий upstream apply НЕ перезапишет — там может жить активный blue-green слот)"
            else
              echo "(на сервере нет — apply установит образец с портом 3000)"
            fi
            echo '```'
            echo "### edge (issue #453, ML-KEM): infra/nginx/edge/delovoy-edge.conf"
            echo '```diff'
            if [ -s /tmp/live-edge.conf ]; then
              diff -u /tmp/live-edge.conf infra/nginx/edge/delovoy-edge.conf || true
            else
              echo "(на сервере нет — первый apply создаст контейнер edge на публичном :443)"
            fi
            echo '```'
            echo "Текущее состояние контейнера delovoy-edge: \`$(cat /tmp/live-edge-state.txt 2>/dev/null || echo 'нет данных')\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  apply:
    name: "Apply (бэкап → nginx -t → reload → внешняя проверка)"
    needs: diff
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.action) == 'apply' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Доставить конфиги и скрипт на VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infra/nginx/delovoy-park.conf,infra/nginx/delovoy-upstream.conf,infra/nginx/delovoy-nginx-perf.logrotate,infra/nginx/edge/delovoy-edge.conf,scripts/apply-nginx-vhost.sh,docker-compose.prod.yml"
          target: "/opt/delovoy-park/"
          overwrite: true

      # issue #453 (ADR §I2): apply теперь состоит из двух шагов, которые
      # обязаны идти в этом порядке — оба владеют портом :443.
      #   1. apply-nginx-vhost.sh переключает host-nginx на loopback :8443
      #      (сам скрипт откатывает СЕБЯ при провале nginx -t, как раньше);
      #      это освобождает :443.
      #   2. docker compose up -d edge поднимает контейнер, который сразу же
      #      занимает освободившийся :443. Если edge не поднимется или не
      #      станет healthy — откатываем host-nginx на публичный :443 из
      #      того же бэкапа, что сделал apply-nginx-vhost.sh, ЗДЕСЬ, а не
      #      полагаемся на внешнюю проверку ниже (та уже не автооткатывает).
      - name: Применить (host-nginx → loopback, затем edge → публичный :443)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
            cd /opt/delovoy-park
            chmod +x scripts/apply-nginx-vhost.sh

            rollback_host_nginx() {
              LATEST=$($SUDO ls -t /etc/nginx/sites-available/delovoy-park.bak-* 2>/dev/null | head -1 || true)
              if [ -n "$LATEST" ]; then
                $SUDO cp "$LATEST" /etc/nginx/sites-available/delovoy-park
                $SUDO nginx -t && $SUDO systemctl reload nginx
                echo "host-nginx откачен на $LATEST (публичный :443)"
              else
                echo "::error::Бэкапа host-nginx нет — публичный :443 не обслуживается никем, чините руками"
              fi
            }

            # Активируем docker-compose.prod.yml → docker-compose.yml, если он
            # только что доставлен (обычный deploy.yml делает то же самое, но
            # ops-nginx apply самодостаточен и не зависит от порядка запуска).
            if [ -f docker-compose.prod.yml ]; then
              mv docker-compose.prod.yml docker-compose.yml
            fi

            if ! scripts/apply-nginx-vhost.sh; then
              echo "::error::apply-nginx-vhost.sh провалился — откат уже выполнен скриптом (edge не трогали)"
              exit 1
            fi

            echo "host-nginx на loopback :8443 — поднимаю edge на публичный :443"
            if ! docker compose up -d --no-deps edge; then
              echo "::error::edge не поднялся — откатываю host-nginx"
              rollback_host_nginx
              exit 1
            fi

            sleep 5
            if ! docker compose ps edge --format '{{.State}}' | grep -q running; then
              echo "::error::edge поднялся, но не running — логи и откат host-nginx"
              docker compose logs --tail 50 edge || true
              docker compose stop edge || true
              rollback_host_nginx
              exit 1
            fi
            echo "✅ edge запущен и слушает публичный :443"

      - name: Внешняя проверка (HTTP/2, 200, живой чанк)
        run: |
          set -u
          sleep 3
          HV=$(curl -sIo /dev/null -w '%{http_version} %{http_code}' --max-time 20 https://delovoy-park.ru || echo "fail")
          echo "https://delovoy-park.ru → HTTP/$HV"
          if [ "$HV" != "2 200" ]; then
            echo "::error::Ожидали '2 200', получили '$HV' — проверьте rollback"
            exit 1
          fi
          R=$(curl -sIo /dev/null -w '%{http_code}' --max-time 20 "https://delovoy-park.ru/api/health" || echo fail)
          echo "/api/health → $R"
          CHUNK=$(curl -s --max-time 20 https://delovoy-park.ru/ | grep -oE '/_next/static/[^"]+\.(js|css)' | head -1 || true)
          if [ -n "$CHUNK" ]; then
            CC=$(curl -sIo /dev/null -w '%{http_code}' --max-time 20 "https://delovoy-park.ru$CHUNK" || echo fail)
            echo "чанк $CHUNK → $CC"
            [ "$CC" = "200" ] || { echo "::error::Чанк не отдаётся"; exit 1; }
          else
            echo "::warning::Не нашёл чанк на главной — пропускаю проверку"
          fi
          echo "✅ vhost применён, HTTP/2 активен"

  rollback:
    name: "Rollback на последний бэкап"
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.action) == 'rollback' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      # issue #453: edge (контейнер, network_mode: host) держит публичный
      # :443 с момента первого apply. Останавливаем его ПЕРВЫМ шагом —
      # иначе восстановленный host-nginx не сможет забиндиться обратно на
      # :443 (EADDRINUSE) и сайт останется без TLS вообще ни с одной стороны.
      - name: Остановить edge (освободить :443) и восстановить host-nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
            cd /opt/delovoy-park

            if docker compose ps edge --format '{{.Names}}' 2>/dev/null | grep -q .; then
              docker compose stop edge
              echo "edge остановлен — :443 освобождён"
            else
              echo "edge не запущен — пропускаю"
            fi

            LATEST=$($SUDO ls -t /etc/nginx/sites-available/delovoy-park.bak-* 2>/dev/null | head -1 || true)
            [ -n "$LATEST" ] || { echo "::error::Бэкапов нет"; exit 1; }
            echo "Восстанавливаю: $LATEST"
            $SUDO cp "$LATEST" /etc/nginx/sites-available/delovoy-park
            $SUDO nginx -t
            $SUDO systemctl reload nginx
            curl -sIo /dev/null -w "https://delovoy-park.ru → %{http_code}\n" --max-time 20 https://delovoy-park.ru || true
