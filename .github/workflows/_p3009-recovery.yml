name: P3009 Recovery (one-shot)

# One-shot workflow to unblock the stuck migration history on prod and apply
# the pending park-discriminator migration. Run ONCE, then delete this file.
on:
  workflow_dispatch:

jobs:
  recover:
    name: Fix migration history + apply park migration + seed
    runs-on: ubuntu-latest
    steps:
      - name: Fix migration history and run seed via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/delovoy-park

            echo "=== Full migration history on prod ==="
            docker compose exec -T postgres psql -U delovoy delovoy_park -c \
              "SELECT migration_name,
                      finished_at IS NOT NULL AS applied,
                      rolled_back_at IS NOT NULL AS rolled_back,
                      applied_steps_count
               FROM _prisma_migrations
               ORDER BY started_at;"

            echo "=== Mark all pre-park migrations as applied in _prisma_migrations ==="
            # All migrations before 20260514000000_add_park_discriminator are physically
            # applied on prod DB but some have failed/pending/rolled-back status in the
            # tracking table. This SQL brings the tracking table in sync with reality.
            docker compose exec -T postgres psql -U delovoy delovoy_park -c \
              "UPDATE _prisma_migrations
               SET finished_at    = COALESCE(finished_at, NOW()),
                   applied_steps_count = 1,
                   logs           = NULL,
                   rolled_back_at = NULL
               WHERE migration_name != '20260514000000_add_park_discriminator';"

            echo "=== Insert any missing migration rows ==="
            # Some migrations may not have a row at all (never tracked).
            # Insert them so prisma migrate deploy sees them as applied.
            for name in \
              0_init \
              20260416000000_add_notify_releases \
              20260417000000_add_user_birthday_gender \
              20260419000000_add_rental_deal_pipeline \
              20260420000000_add_receipt_v2_workflow \
              20260421000000_add_deletion_log \
              20260421120000_rental_email_notifications \
              20260421130000_add_backup_log \
              20260423000000_link_stock_batch_to_receipt_tx \
              20260423180000_booking_user_nullable \
              20260425000000_feedback_office_linkage \
              20260425120000_inventory_sku_unique_name \
              20260426000000_tasks_kanban_and_channel_agnostic_notifications \
              20260427000000_auth_crm_v1_schema \
              20260428000000_avito_integration \
              20260504120000_add_order_booking_id \
              20260504120000_subscriptions \
              20260510000001_add_web_push_subscription \
              20260510120000_release_notify_default_true
            do
              docker compose exec -T postgres psql -U delovoy delovoy_park -c \
                "INSERT INTO _prisma_migrations (id, checksum, finished_at, migration_name, logs, rolled_back_at, started_at, applied_steps_count)
                 VALUES (gen_random_uuid(), 'recovered', NOW(), '${name}', NULL, NULL, NOW(), 1)
                 ON CONFLICT (migration_name) DO NOTHING;" 2>&1 | grep -v "^INSERT\|^$" || true
            done

            echo "=== Verify migration history after patch ==="
            docker compose exec -T postgres psql -U delovoy delovoy_park -c \
              "SELECT migration_name,
                      finished_at IS NOT NULL AS applied,
                      rolled_back_at IS NOT NULL AS rolled_back
               FROM _prisma_migrations
               ORDER BY migration_name;"

            echo "=== Apply only the pending park migration ==="
            docker compose exec -T app npx prisma migrate deploy \
              && echo "✅ Park migration applied" \
              || { echo "❌ Migration failed"; exit 1; }

            echo "=== Run seed pipeline ==="
            docker compose exec -T app npx tsx scripts/seed.ts \
              && echo "✅ Seed complete" \
              || { echo "❌ Seed failed"; exit 1; }

            echo "=== Verify Park table and SUPERADMIN grants ==="
            docker compose exec -T postgres psql -U delovoy delovoy_park -c \
              "SELECT slug FROM \"Park\";"
            docker compose exec -T postgres psql -U delovoy delovoy_park -c \
              "SELECT u.email, ap.section
               FROM \"User\" u
               JOIN \"AdminPermission\" ap ON ap.\"userId\" = u.id
               WHERE u.role = 'SUPERADMIN' AND ap.section = 'nedelovoy';"

            echo "=== Recovery complete ==="
