name: Apply Cafe Menu on Production

# Manual one-off trigger. Runs scripts/update-cafe-menu.ts inside the prod `app`
# container to sync MenuItem rows with the wall price list (scripts/lib/cafe-menu.ts):
# updates prices/categories/order, creates missing positions, hides positions that
# are no longer on the board (isAvailable=false — reversible from the admin panel).
#
# Why a separate workflow (not the seed): scripts/seed.ts intentionally does NOT
# overwrite prices on existing menu items (see seedCore), so it cannot correct
# price data already in the DB. This script does — run it once after deploying a
# price change, then let the admin panel manage the menu going forward.
# Idempotent: double run = same state.
#
# Requires the updated price list to be deployed first (merge → deploy), otherwise
# the container still holds the previous values.
#
# Set `dry_run: true` first to review the diff in the job log without writing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать изменения, ничего не записывать"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  apply-menu:
    name: Apply cafe menu price list
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run menu sync via SSH
        uses: appleboy/ssh-action@v1
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DRY_RUN
          script: |
            set -e
            cd /opt/delovoy-park

            # exec по имени контейнера, а не по имени сервиса compose: при
            # blue-green активным может быть слот app-b, который лежит в
            # профиле "bluegreen" и для `compose exec app` невидим — оттуда
            # «service "app" is not running». Слот читаем из ACTIVE_SLOT,
            # как это делает deploy.yml.
            APP_CONT=delovoy-app
            if [ "$(cat ACTIVE_SLOT 2>/dev/null || echo a)" = "b" ]; then
              APP_CONT=delovoy-app-b
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx "$APP_CONT"; then
              echo "❌ Контейнер $APP_CONT не запущен — прод в неожиданном состоянии"
              docker ps --format '  {{.Names}}\t{{.Status}}'
              exit 1
            fi

            FLAG=""
            if [ "$DRY_RUN" = "true" ]; then FLAG="--dry-run"; fi
            echo "=== Applying cafe menu price list via $APP_CONT $FLAG ==="
            docker exec "$APP_CONT" npx tsx scripts/update-cafe-menu.ts $FLAG
            echo "=== Done ==="
