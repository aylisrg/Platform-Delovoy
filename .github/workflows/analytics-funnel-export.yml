name: Analytics — недельный экспорт воронки

# Агрегаты ProductEvent за две закрытые недели → repo variable FUNNEL_WEEKLY_STATS
# (US-2 эпика #583, ADR docs/adr/2026-09-16-weekly-product-analyst-loop.md §4).
#
# Зачем переменная: недельная сессия product-analyst не имеет ни VPS-секретов,
# ни доступа к прод-Postgres — её единственный внешний канал это GitHub API.
# Repo variable — уже обкатанный канал «workflow → переменная → потребитель»
# (deploy.yml пишет DEPLOYED_SHA_CURRENT, owner-digest.ts читает), лимит 48 КБ,
# полезная нагрузка тут — единицы килобайт счётчиков.
#
# AI здесь нет: только детерминированный дамп. Данные обезличены по построению —
# в выборку попадают funnel/step/день и два счётчика; идентификатор посетителя
# используется ТОЛЬКО внутри COUNT(DISTINCT …) и переменную не покидает.

on:
  schedule:
    - cron: "40 5 * * 1" # 08:40 МСК, понедельник — за 20 минут до Routine аналитика
  workflow_dispatch: # сессия дёргает руками, если переменная протухла

permissions:
  contents: read
  actions: write # gh variable set (тот же приём, что в deploy.yml)

concurrency:
  group: analytics-funnel-export
  cancel-in-progress: false

jobs:
  export:
    name: Агрегаты ProductEvent → repo variable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Дамп агрегатов воронки (SSH → psql)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::VPS_HOST/VPS_USER/VPS_SSH_KEY не заданы — дамп с прода невозможен"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/funnel_key
          chmod 600 ~/.ssh/funnel_key

          # SQL едет через два слоя shell (локальный → ssh → удалённый), поэтому
          # в нём нет ни одной одинарной кавычки: строковые литералы — $$...$$,
          # интервалы — make_interval (паттерн backlog-intake.yml).
          #
          # Период — две ЗАКРЫТЫЕ недели Пн–Вс по МСК: начало текущей недели в
          # Москве минус 14 дней … минус 0. Выражение начала недели повторяется,
          # а не выносится в CTE/подзапрос, намеренно: так ни одна часть запроса
          # не зависит от внешнего уровня и его не на чем сломать.
          # ProductEvent."createdAt" — timestamp без зоны в UTC (Prisma), а
          # Москва — фиксированный UTC+3 без перехода на летнее время, поэтому
          # граница сдвигается ровно на 3 часа.
          SQL=$(cat <<'SQL'
          SELECT json_build_object(
            $$schemaVersion$$, 1,
            $$generatedAt$$, replace(to_char(now() AT TIME ZONE $$UTC$$, $$YYYY-MM-DD HH24:MI:SS$$), $$ $$, $$T$$) || $$Z$$,
            $$periods$$, json_build_object(
              $$current$$, json_build_object(
                $$dateFrom$$, (date_trunc($$week$$, now() AT TIME ZONE $$Europe/Moscow$$) - make_interval(days => 7))::date::text,
                $$dateTo$$, (date_trunc($$week$$, now() AT TIME ZONE $$Europe/Moscow$$) - make_interval(days => 1))::date::text),
              $$previous$$, json_build_object(
                $$dateFrom$$, (date_trunc($$week$$, now() AT TIME ZONE $$Europe/Moscow$$) - make_interval(days => 14))::date::text,
                $$dateTo$$, (date_trunc($$week$$, now() AT TIME ZONE $$Europe/Moscow$$) - make_interval(days => 8))::date::text)),
            $$rows$$, COALESCE((
              SELECT json_agg(t) FROM (
                SELECT funnel, step,
                       ((("createdAt" AT TIME ZONE $$UTC$$) AT TIME ZONE $$Europe/Moscow$$)::date)::text AS day,
                       COUNT(*)::int AS events,
                       COUNT(DISTINCT "sessionKey")::int AS sessions
                FROM "ProductEvent"
                WHERE "createdAt" >= date_trunc($$week$$, now() AT TIME ZONE $$Europe/Moscow$$) - make_interval(days => 14, hours => 3)
                  AND "createdAt" <  date_trunc($$week$$, now() AT TIME ZONE $$Europe/Moscow$$) - make_interval(hours => 3)
                GROUP BY 1, 2, 3
                ORDER BY 1, 2, 3
              ) t), $$[]$$::json)
          );
          SQL
          )

          ssh -i ~/.ssh/funnel_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" \
              "docker exec delovoy-postgres psql -U delovoy -d delovoy_park -Atc '$SQL'" > funnel-stats.json
          rm -f ~/.ssh/funnel_key

          # Валидность — сразу и громко: молча-битый экспорт неотличим от рабочего,
          # а сессия аналитика узнает о нём только через сутки.
          jq -e 'type == "object" and .schemaVersion == 1 and (.rows | type == "array")' funnel-stats.json > /dev/null
          jq -c '{generatedAt, periods, rows: (.rows | length)}' funnel-stats.json

      - name: Проверить размер и записать repo variable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Лимит GitHub на значение переменной — 48 КБ. При нынешнем масштабе
          # запас десятикратный; упрёмся — переключимся на недельные бакеты
          # вместо дневных (ADR §11.4), поэтому падаем явно, а не молча обрезаем.
          SIZE=$(jq -c . funnel-stats.json | wc -c)
          echo "payload: ${SIZE} байт"
          if [ "$SIZE" -gt 40000 ]; then
            echo "::error::агрегаты выросли до ${SIZE} байт — repo variable не выдержит, нужны недельные бакеты (ADR §11.4)"
            exit 1
          fi
          jq -c . funnel-stats.json | gh variable set FUNNEL_WEEKLY_STATS

      - name: Итог в summary
        if: always()
        run: |
          {
            echo '## Недельный экспорт воронки'
            echo
            echo '```json'
            jq -c '{generatedAt, periods, rows: (.rows | length)}' funnel-stats.json 2>/dev/null || echo 'дамп не доехал'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Telegram — экспорт сломан
        if: failure()
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram secrets not set — skipping alert"; exit 0
          fi
          # Алерт в АДМИНСКУЮ группу, не владельцу: это поломка механики, а не
          # решение. Молчащий экспорт неотличим от «данных нет» — отсюда алерт.
          TEXT="📉 <b>Недельный экспорт воронки упал</b>"
          TEXT+=$'\n\n'
          TEXT+="Агрегаты ProductEvent не доехали в FUNNEL_WEEKLY_STATS."$'\n'
          TEXT+="Понедельничный отчёт product-analyst останется без данных."$'\n'
          TEXT+="<b>Run:</b> <a href='${RUN_URL}'>лог</a>"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}" \
            -o /dev/null || true
