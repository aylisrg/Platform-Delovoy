name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      # PRs created by GITHUB_TOKEN do NOT trigger pull_request workflows
      # (GitHub's loop-protection). That makes release-please PRs hang forever
      # because branch protection waits for lint/test/build that never run.
      # Fix: use a PAT with `repo` + `workflow` scopes stored as AUTOMATION_TOKEN
      # (RELEASE_PLEASE_TOKEN — исторический синоним). Falls back to
      # GITHUB_TOKEN if no PAT is set — the release PR is still created but its
      # CI must be kicked manually.
      #
      # Release PR мержится руками, когда нужен релиз: мерж поднимает версию,
      # и deploy.yml шлёт анонс «🚀 Релиз vX» (один раз на версию).
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
          token: ${{ secrets.AUTOMATION_TOKEN || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
