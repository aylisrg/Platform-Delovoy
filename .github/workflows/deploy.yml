name: Deploy to Production

on:
  # Auto-deploy: triggers when CI passes on main. Runs immediately — no wait timer.
  # If you need a cooldown in the future, configure it per-environment in
  # GitHub Settings → Environments → production → Wait timer.
  workflow_run:
    workflows: ["CI \u2014 Lint, Test, Build"]
    types: [completed]
    branches: [main]

  # Fallback trigger: if workflow_run doesn't fire (release-please rewrites
  # main HEAD, paths-ignore on CI, race with concurrency group, etc.), the
  # plain push trigger guarantees we still deploy. The build-and-push job's
  # "retag from sha image" step finds the CI-pushed image when present
  # (~30s); the "Build and push (fallback)" step rebuilds from GHA cache
  # otherwise (~3-5 min). Concurrency group on commit SHA prevents double
  # deploys when both triggers fire.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

  # Manual trigger for hotfixes, emergency re-deploys, or targeted rollouts.
  # Fast path retags an existing sha-<SHA> image from GHCR — no rebuild.
  # Skip flags trade safety for speed; use them only when you know what you're doing.
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (empty = current main HEAD)"
        required: false
        default: ""
      skip_snapshot:
        description: "Skip Timeweb VPS snapshot (~30s)"
        type: boolean
        default: false
      skip_db_backup:
        description: "Skip pg_dump before deploy (~30-60s) — hotfix only"
        type: boolean
        default: false
      skip_smoke_tests:
        description: "Skip post-deploy smoke tests (~10s) — hotfix only"
        type: boolean
        default: false
      force_legacy_deploy:
        description: "Форсировать legacy-деплой (rolling с даунтаймом) вместо blue-green"
        type: boolean
        default: false

concurrency:
  # Group by commit SHA so push + workflow_run for the same commit don't both
  # deploy. workflow_dispatch (manual) is allowed in parallel for hotfixes.
  group: deploy-production-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false  # Never cancel a deploy in progress

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/platform-delovoy

jobs:
  # Gate: only run when triggered by a successful CI run, manual dispatch,
  # or a push to main (fallback when workflow_run doesn't fire).
  build-and-push:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    name: Tag Production Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      resolved_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve target SHA
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.sha }}" ]; then
            echo "sha=${{ github.event.inputs.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - name: Extract version from package.json
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Fast path: retag sha image already built by CI — no rebuild.
      # Works for auto-deploy AND hotfix-dispatch (if the SHA was built by CI).
      - name: Retag sha image as production
        id: retag
        continue-on-error: true
        run: |
          TARGET_SHA="${{ steps.resolve.outputs.sha }}"
          SHORT_SHA=$(echo "$TARGET_SHA" | cut -c1-7)
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA} \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${TARGET_SHA}

      # Slow path (fallback): full rebuild when sha image is missing from GHCR.
      - name: Build and push (fallback)
        if: steps.retag.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ steps.resolve.outputs.sha }}
            BUILD_TIME=${{ github.event.workflow_run.head_commit.timestamp || github.event.head_commit.timestamp }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.resolve.outputs.sha }}

  deploy:
    name: Deploy to Timeweb VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create Timeweb snapshot before deploy
        if: ${{ !inputs.skip_snapshot }}
        continue-on-error: true
        env:
          TIMEWEB_TOKEN: ${{ secrets.TIMEWEB_API_TOKEN }}
        run: |
          if [ -z "$TIMEWEB_TOKEN" ]; then
            echo "No TIMEWEB_API_TOKEN — skipping snapshot"
            exit 0
          fi

          # Get server ID
          SERVER_ID=$(curl -s -H "Authorization: Bearer $TIMEWEB_TOKEN" \
            "https://api.timeweb.cloud/api/v1/servers" | jq '.servers[0].id // empty')

          if [ -n "$SERVER_ID" ]; then
            echo "Creating snapshot for server $SERVER_ID before deploy..."
            curl -s -X POST \
              -H "Authorization: Bearer $TIMEWEB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"comment\": \"Pre-deploy snapshot — ${{ github.sha }}\"}" \
              "https://api.timeweb.cloud/api/v1/servers/$SERVER_ID/disks/backups" | jq '.'
            echo "Snapshot requested"
          else
            echo "No server found — skipping snapshot"
          fi

      - name: Setup media directory and register upload key
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /var/www/delovoy/media/{gazebos,park,spaces,ps-park}
            MEDIA_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG8/5QxKlQERUNuYOBiGdtI8AkzBVJCDaTTR9WSPLU+a media-upload"
            if ! grep -qF "media-upload" ~/.ssh/authorized_keys 2>/dev/null; then
              echo "$MEDIA_KEY" >> ~/.ssh/authorized_keys
              echo "Media upload key added"
            else
              echo "Media upload key already present"
            fi

      - name: Check Telegram secrets
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_ADMIN: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TG_OWNER: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && echo "::warning::TELEGRAM_BOT_TOKEN is empty — TG notifications will be silenced"
          [ -z "$TG_ADMIN" ] && echo "::warning::TELEGRAM_ADMIN_CHAT_ID is empty — admin alerts won't be delivered"
          [ -z "$TG_OWNER" ] && echo "::warning::TELEGRAM_OWNER_CHAT_ID is empty — owner DMs won't be delivered"
          echo "Telegram secret check complete"

      - name: Probe Telegram bot reachability
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::warning::Skipping TG probe — secrets missing"
            exit 0
          fi
          ME=$(curl -sf --max-time 8 "https://api.telegram.org/bot$TG_TOKEN/getMe" || echo '{"ok":false}')
          if ! echo "$ME" | jq -e '.ok==true' >/dev/null 2>&1; then
            echo "::warning::getMe failed — bot token may be invalid or TG API unreachable"
            exit 0
          fi
          BOT=$(echo "$ME" | jq -r '.result.username // "unknown"')
          CHAT=$(curl -sf --max-time 8 "https://api.telegram.org/bot$TG_TOKEN/getChat?chat_id=$TG_CHAT" || echo '{"ok":false}')
          if ! echo "$CHAT" | jq -e '.ok==true' >/dev/null 2>&1; then
            REASON=$(echo "$CHAT" | jq -r '.description // "unknown"')
            echo "::warning::getChat failed ($REASON) — bot may have been kicked from admin group or chat_id is wrong"
            exit 0
          fi
          TITLE=$(echo "$CHAT" | jq -r '.result.title // .result.username // "unknown"')
          echo "✅ Bot @$BOT reachable, admin chat: $TITLE"

      - name: Sync secrets to server .env
        uses: appleboy/ssh-action@v1
        env:
          NOVOFON_API_KEY: ${{ secrets.NOVOFON_API_KEY }}
          NOVOFON_WEBHOOK_SECRET: ${{ secrets.NOVOFON_WEBHOOK_SECRET }}
          NOVOFON_DEFAULT_SIP_LINE: ${{ secrets.NOVOFON_DEFAULT_SIP_LINE }}
          NOVOFON_CALLER_ID: ${{ secrets.NOVOFON_CALLER_ID }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          BOT_INTERNAL_SECRET: ${{ secrets.BOT_INTERNAL_SECRET }}
          RELEASE_NOTIFY_SECRET: ${{ secrets.RELEASE_NOTIFY_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: NOVOFON_API_KEY,NOVOFON_WEBHOOK_SECRET,NOVOFON_DEFAULT_SIP_LINE,NOVOFON_CALLER_ID,YANDEX_CLIENT_ID,YANDEX_CLIENT_SECRET,SMTP_USER,SMTP_PASS,SMTP_FROM,BOT_INTERNAL_SECRET,RELEASE_NOTIFY_SECRET,TELEGRAM_BOT_TOKEN,TELEGRAM_ADMIN_CHAT_ID,TELEGRAM_OWNER_CHAT_ID,YOOKASSA_SHOP_ID,YOOKASSA_SECRET_KEY
          script: |
            set -e
            cd /opt/delovoy-park

            # Write or update a key in .env without touching other lines.
            # Empty value = keep whatever was there before (warn, don't overwrite).
            upsert_env() {
              local key="$1" val="$2"
              if [ -z "$val" ]; then
                echo "⚠️  $key is empty in GH secrets — keeping previous .env value if any"
                return
              fi
              if grep -q "^${key}=" .env 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${val}|" .env
              else
                echo "${key}=${val}" >> .env
              fi
            }

            upsert_env NOVOFON_API_KEY           "$NOVOFON_API_KEY"
            upsert_env NOVOFON_WEBHOOK_SECRET     "$NOVOFON_WEBHOOK_SECRET"
            upsert_env NOVOFON_DEFAULT_SIP_LINE   "$NOVOFON_DEFAULT_SIP_LINE"
            upsert_env NOVOFON_CALLER_ID          "$NOVOFON_CALLER_ID"
            upsert_env YANDEX_CLIENT_ID           "$YANDEX_CLIENT_ID"
            upsert_env YANDEX_CLIENT_SECRET       "$YANDEX_CLIENT_SECRET"
            upsert_env SMTP_USER                  "$SMTP_USER"
            upsert_env SMTP_PASS                  "$SMTP_PASS"
            upsert_env SMTP_FROM                  "$SMTP_FROM"
            upsert_env BOT_INTERNAL_SECRET        "$BOT_INTERNAL_SECRET"
            upsert_env RELEASE_NOTIFY_SECRET      "$RELEASE_NOTIFY_SECRET"
            upsert_env TELEGRAM_BOT_TOKEN         "$TELEGRAM_BOT_TOKEN"
            upsert_env TELEGRAM_ADMIN_CHAT_ID     "$TELEGRAM_ADMIN_CHAT_ID"
            upsert_env TELEGRAM_OWNER_CHAT_ID     "$TELEGRAM_OWNER_CHAT_ID"
            # TELEGRAM_PROXY_URL / TELEGRAM_API_ROOT сознательно НЕ синкаются из
            # GH-секретов: источник истины — .env на VPS (ставится workflow'ом
            # ops-env). Синк из секретов перезатирал рабочий релей устаревшим
            # значением на каждом деплое.

            # === YooKassa (онлайн-оплата) ===
            upsert_env YOOKASSA_SHOP_ID           "$YOOKASSA_SHOP_ID"
            upsert_env YOOKASSA_SECRET_KEY        "$YOOKASSA_SECRET_KEY"

            # Дефолты — добавляются только если ключа ещё нет (ручная правка
            # .env на сервере переживает деплой).
            ensure_env() {
              local key="$1" val="$2"
              if ! grep -q "^${key}=" .env 2>/dev/null; then
                echo "${key}=${val}" >> .env
                echo "➕ ${key} set to default"
              fi
            }
            ensure_env YOOKASSA_RECEIPTS_ENABLED "true"
            ensure_env YOOKASSA_VAT_CODE "1"

            # CRON_SECRET: без него шаг регистрации кронов молча выходит и ни
            # один cron (process-outgoing, payments-reconcile) не ставится.
            # Генерируется один раз; app-контейнер получает его через env_file.
            if ! grep -q "^CRON_SECRET=" .env 2>/dev/null; then
              echo "CRON_SECRET=$(openssl rand -hex 32)" >> .env
              echo "➕ CRON_SECRET generated"
            fi

            # Вебхук-секрет генерируется на сервере при первом деплое и никогда
            # не покидает VPS (в лог не печатается). Готовый URL для ЛК ЮKassa
            # уходит владельцу в Telegram.
            if ! grep -q "^YOOKASSA_WEBHOOK_SECRET=" .env 2>/dev/null; then
              YK_WEBHOOK_SECRET=$(openssl rand -hex 32)
              echo "YOOKASSA_WEBHOOK_SECRET=${YK_WEBHOOK_SECRET}" >> .env
              echo "➕ YOOKASSA_WEBHOOK_SECRET generated"
              if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_OWNER_CHAT_ID" ]; then
                # Транспорт Telegram читаем из .env на VPS (источник истины —
                # ops-telegram-relay/ops-env, из GH-секретов он больше не синкается).
                TG_ROOT=$(grep -oP '^TELEGRAM_API_ROOT=\K.*' .env 2>/dev/null | tr -d '"' || true)
                TG_ROOT="${TG_ROOT:-https://api.telegram.org}"
                TG_PROXY=$(grep -oP '^TELEGRAM_PROXY_URL=\K.*' .env 2>/dev/null | tr -d '"' || true)
                TG_PROXY_ARGS=""
                [ -n "$TG_PROXY" ] && TG_PROXY_ARGS="-x $TG_PROXY"
                TG_MSG=$(printf 'ЮKassa: создан секрет вебхука. Вставьте этот URL в ЛК ЮKassa → Интеграция → HTTP-уведомления (события: payment.succeeded, payment.waiting_for_capture, payment.canceled, refund.succeeded):\n\nhttps://delovoy-park.ru/api/payments/yookassa/webhook/%s' "$YK_WEBHOOK_SECRET")
                if curl -fsS --max-time 15 $TG_PROXY_ARGS -X POST "${TG_ROOT}/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                    -d chat_id="${TELEGRAM_OWNER_CHAT_ID}" \
                    --data-urlencode text="${TG_MSG}" > /dev/null 2>&1; then
                  echo "✅ Webhook URL отправлен владельцу в Telegram"
                else
                  echo "⚠️  Telegram недоступен — webhook URL смотрите в /opt/delovoy-park/.env (YOOKASSA_WEBHOOK_SECRET)"
                fi
              else
                echo "⚠️  Telegram secrets отсутствуют — webhook URL смотрите в /opt/delovoy-park/.env (YOOKASSA_WEBHOOK_SECRET)"
              fi
            fi

            echo "Secrets synced to .env"

      - name: Sync docker-compose.prod.yml and ops scripts to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Скрипты нужны на VPS: cron-backup.sh — для ежедневного бэкапа
          # (шаг регистрации крона ниже), watchdog-remediate.sh — свежая копия
          # для site-watchdog.yml на случай, если SSH-доставка из watchdog не сработает.
          source: "docker-compose.prod.yml,scripts/cron-backup.sh,scripts/backup-db.sh,scripts/watchdog-remediate.sh,scripts/local-watchdog.sh,scripts/apply-nginx-static-archive.sh,scripts/apply-nginx-vhost.sh,scripts/deploy-bluegreen.sh,infra/nginx/delovoy-park.conf,infra/nginx/delovoy-upstream.conf,infra/nginx/edge/delovoy-edge.conf"
          target: "/opt/delovoy-park/"
          overwrite: true

      - name: Activate compose file on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/delovoy-park
            mv docker-compose.prod.yml docker-compose.yml
            echo "docker-compose.yml updated"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          SKIP_DB_BACKUP: ${{ inputs.skip_db_backup }}
          FORCE_LEGACY_DEPLOY: ${{ inputs.force_legacy_deploy }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          envs: SKIP_DB_BACKUP,FORCE_LEGACY_DEPLOY
          script: |
            set -e
            cd /opt/delovoy-park

            echo "=== Pull new image ==="
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            if [ "$SKIP_DB_BACKUP" = "true" ]; then
              echo "=== Backup skipped (skip_db_backup=true) ==="
            else
              echo "=== Backup current state ==="
              docker compose exec -T postgres pg_dump -U delovoy delovoy_park | gzip > /opt/backups/db-$(date +%Y%m%d-%H%M%S).sql.gz
            fi

            echo "=== Save current image for rollback ==="
            # Имя контейнера — delovoy-app (container_name в compose), не
            # compose-дефолт delovoy-park-app-1: со старым именем inspect
            # всегда падал и rollback молча оставался без образа.
            # Берём image ID ({{.Image}}), а не тег: .Config.Image вернул бы
            # ":latest", и откат снова поднял бы только что сломавшийся образ.
            # Образ прошлого билда остаётся локально — pull не нужен.
            CURRENT_IMAGE=$(docker inspect --format='{{.Image}}' delovoy-app 2>/dev/null || echo "")
            echo "Current image: ${CURRENT_IMAGE:-none}"

            echo "=== Apply pending DB migrations (new image; old app keeps serving) ==="
            # Миграции идут ДО подмены контейнера: провал = деплой отменён,
            # работающее приложение не тронуто. Раньше миграции жили в
            # entrypoint и держали порт 3000 мёртвым 1–3 минуты на каждом
            # старте (инцидент 2026-07-20). prisma migrate deploy идемпотентен;
            # пред-миграционный бэкап снят выше (pg_dump → /opt/backups).
            docker compose run --rm --no-deps app npx prisma migrate deploy \
              && echo "✅ Migrations applied" \
              || { echo "❌ Migration failed — aborting deploy, old app untouched"; exit 1; }

            echo "=== Deploy mode ==="
            # Blue-green включается сам, когда ops-nginx apply уже установил
            # upstream-файл (свежий VPS без него безопасно идёт legacy-путём).
            DEPLOY_MODE=legacy
            if [ "${FORCE_LEGACY_DEPLOY:-false}" != "true" ] \
               && [ -f /etc/nginx/conf.d/delovoy-upstream.conf ] \
               && [ -f scripts/deploy-bluegreen.sh ]; then
              DEPLOY_MODE=bluegreen
            fi
            echo "Deploy mode: $DEPLOY_MODE"

            APP_CONT=delovoy-app
            if [ "$DEPLOY_MODE" = "bluegreen" ]; then
              echo "=== Blue-green deploy (zero-downtime) ==="
              chmod +x scripts/deploy-bluegreen.sh
              # Скрипт атомарен: провал до переключения upstream не трогает
              # работающий слот (сам гасит неудавшийся новый слот, exit 1 →
              # set -e прерывает деплой, rollback не нужен). Статик-архив
              # и даунтайм-метр — внутри скрипта.
              sh scripts/deploy-bluegreen.sh
              ACTIVE_SLOT=$(cat ACTIVE_SLOT 2>/dev/null || echo a)
              [ "$ACTIVE_SLOT" = "b" ] && APP_CONT=delovoy-app-b
              HEALTHY=true
            else
              # Legacy-эвакуация после blue-green: вернуть трафик на 3000,
              # иначе upstream смотрит на 3001, а мы рестартуем app:3000.
              if [ -f /etc/nginx/conf.d/delovoy-upstream.conf ] && [ "$(cat ACTIVE_SLOT 2>/dev/null || echo a)" = "b" ]; then
                echo "=== Legacy after blue-green: возвращаю upstream на 3000 ==="
                printf 'upstream delovoy_app {\n    server 127.0.0.1:3000;\n    keepalive 32;\n}\n' | sudo tee /etc/nginx/conf.d/delovoy-upstream.conf >/dev/null
                sudo nginx -t && sudo systemctl reload nginx
                echo a > ACTIVE_SLOT
                docker compose --profile bluegreen stop app-b 2>/dev/null || true
              fi

              echo "=== Rolling deploy (legacy) ==="
              docker compose up -d --no-deps app

              echo "=== Wait for health check ==="
              HEALTHY=false
              for i in $(seq 1 30); do
                if docker compose exec -T app wget --spider --quiet --timeout=5 http://localhost:3000/api/health 2>/dev/null; then
                  echo "Health check passed on attempt $i"
                  HEALTHY=true
                  break
                fi
                echo "Attempt $i/30 — waiting..."
                sleep 5
              done
            fi

            if [ "$HEALTHY" = true ]; then
              if [ "$DEPLOY_MODE" = "legacy" ]; then
              echo "=== Archive build static assets ==="
              # Копим content-hashed статику последних билдов на хосте: nginx
              # отдаёт её с диска (scripts/apply-nginx-static-archive.sh), и
              # открытые до деплоя вкладки не ловят 404 на чанки старого билда.
              # Провал шага не фатален — статика просто проксируется в app.
              ARCHIVE=/opt/delovoy-park/static-archive/_next/static
              mkdir -p "$ARCHIVE"
              if docker cp delovoy-app:/app/.next/static/. "$ARCHIVE/"; then
                chmod -R a+rX "$ARCHIVE" || true
                find "$ARCHIVE" -type f -mtime +14 -delete || true
                find "$ARCHIVE" -type d -empty -delete || true
                sh scripts/apply-nginx-static-archive.sh \
                  || echo "⚠️ nginx static-archive not applied — static keeps proxying to app"
              else
                echo "⚠️ docker cp failed — static archive skipped"
              fi
              fi

              echo "=== Run unified seed pipeline ==="
              # Idempotent reference-data seed (modules, boards, categories, demo offices, etc).
              # See docs/adr/ADR-0001-unified-seed-pipeline.md
              # Failure here is a deploy failure — without seed Tasks/etc are broken.
              # exec по имени контейнера ($APP_CONT): при blue-green активный
              # слот может быть app-b, которого нет в дефолтном профиле compose.
              docker exec "$APP_CONT" npx tsx scripts/seed.ts \
                && echo "✅ Seed pipeline OK" \
                || { echo "❌ Seed pipeline FAILED"; exit 1; }

              echo "=== Run data migrations ==="
              docker exec "$APP_CONT" npx tsx scripts/set-public-phone.ts \
                && echo "✅ Phone config applied" \
                || echo "⚠️ set-public-phone.ts failed — check manually"

              echo "=== Bot rolling deploy ==="
              # Бот = отдельный сервис, тот же image. --no-deps чтобы не трогать
              # postgres/redis. `up -d` пересоздаст контейнер: старый получит
              # SIGTERM до старта нового, окно overlap минимально (Telegram
              # 409 Conflict если оба live одновременно).
              docker compose up -d --no-deps bot
              sleep 5
              if ! docker compose ps bot --format '{{.State}}' | grep -q running; then
                echo "❌ ERROR: bot failed to start"
                docker compose logs --tail 50 bot || true
                exit 1
              fi
              echo "✅ Bot is running"

              exit 0
            fi

            echo "FATAL: Health check failed after 30 attempts"
            echo "=== Rolling back ==="
            if [ -n "$CURRENT_IMAGE" ]; then
              echo "Rolling back to: $CURRENT_IMAGE"
              docker pull "$CURRENT_IMAGE" 2>/dev/null || true
              DEPLOY_IMAGE="$CURRENT_IMAGE" docker compose up -d --no-deps app
              echo "Rollback complete — waiting for health check..."
              sleep 10
              if docker compose exec -T app wget --spider --quiet --timeout=5 http://localhost:3000/api/health 2>/dev/null; then
                echo "Rollback health check PASSED"
              else
                echo "WARNING: Rollback health check also failed — manual intervention needed"
              fi
            else
              echo "No previous image found — restarting current container"
              docker compose restart app
            fi
            exit 1

      - name: Ensure process-outgoing cron is registered
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            CRON_SECRET_VAL=$(grep '^CRON_SECRET=' /opt/delovoy-park/.env 2>/dev/null | cut -d= -f2- || true)
            if [ -z "$CRON_SECRET_VAL" ]; then
              echo "⚠️  CRON_SECRET not found in .env — skipping cron setup (add it manually)"
              exit 0
            fi
            CRON_ENTRY="* * * * * curl -fsS -H 'Authorization: Bearer ${CRON_SECRET_VAL}' https://delovoy-park.ru/api/cron/process-outgoing > /dev/null 2>&1"
            if crontab -l 2>/dev/null | grep -q 'process-outgoing'; then
              echo "✅ process-outgoing cron already registered"
            else
              (crontab -l 2>/dev/null; echo "$CRON_ENTRY") | crontab -
              echo "✅ process-outgoing cron installed (every minute)"
            fi

            # Сверка платежей ЮKassa: добивает зависшие статусы, если вебхук
            # не дошёл (ретраи ЮKassa живут только 24 часа).
            RECONCILE_ENTRY="*/10 * * * * curl -fsS -H 'Authorization: Bearer ${CRON_SECRET_VAL}' https://delovoy-park.ru/api/cron/payments-reconcile > /dev/null 2>&1"
            if crontab -l 2>/dev/null | grep -q 'payments-reconcile'; then
              echo "✅ payments-reconcile cron already registered"
            else
              (crontab -l 2>/dev/null; echo "$RECONCILE_ENTRY") | crontab -
              echo "✅ payments-reconcile cron installed (every 10 minutes)"
            fi

            # Напоминания о бронях + алерты истечения договоров: раньше cron
            # нигде не регистрировался и напоминания молча не отправлялись.
            NOTIFY_ENTRY="*/5 * * * * curl -fsS -H 'Authorization: Bearer ${CRON_SECRET_VAL}' https://delovoy-park.ru/api/cron/notifications > /dev/null 2>&1"
            if crontab -l 2>/dev/null | grep -q 'api/cron/notifications'; then
              echo "✅ scheduled-notifications cron already registered"
            else
              (crontab -l 2>/dev/null; echo "$NOTIFY_ENTRY") | crontab -
              echo "✅ scheduled-notifications cron installed (every 5 minutes)"
            fi

      - name: Ensure daily DB backup cron is registered
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Ежедневный бэкап БД. 01:30 UTC = 04:30 MSK — вне окна прочих
            # ночных задач (сервер живёт в UTC, проверено ops-diagnose).
            # Аудит 2026-07-18 показал, что cron бэкапа вообще не был
            # зарегистрирован — деплой теперь гарантирует его наличие.
            BACKUP_ENTRY="30 1 * * * /opt/delovoy-park/scripts/cron-backup.sh >> /var/log/delovoy-backup.log 2>&1"
            if crontab -l 2>/dev/null | grep -q 'cron-backup.sh'; then
              echo "✅ daily backup cron already registered"
            else
              (crontab -l 2>/dev/null; echo "$BACKUP_ENTRY") | crontab -
              echo "✅ daily backup cron installed (01:30 UTC / 04:30 MSK)"
            fi
            chmod +x /opt/delovoy-park/scripts/cron-backup.sh /opt/delovoy-park/scripts/backup-db.sh 2>/dev/null || true

            # Минутный локальный вотчдог: GitHub cron троттлится до ~1 раза
            # в час — локальный проб закрывает дыру обнаружения
            # (инцидент 2026-07-20). Тихий при здоровом сайте.
            LOCAL_WD_ENTRY="* * * * * /opt/delovoy-park/scripts/local-watchdog.sh >> /var/log/delovoy-local-watchdog.log 2>&1"
            if crontab -l 2>/dev/null | grep -q 'local-watchdog.sh'; then
              echo "✅ local watchdog cron already registered"
            else
              (crontab -l 2>/dev/null; echo "$LOCAL_WD_ENTRY") | crontab -
              echo "✅ local watchdog cron installed (every minute)"
            fi
            chmod +x /opt/delovoy-park/scripts/local-watchdog.sh /opt/delovoy-park/scripts/watchdog-remediate.sh 2>/dev/null || true

      - name: Verify deployment + smoke tests
        if: ${{ !inputs.skip_smoke_tests }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== Health check ==="
            curl -sf https://delovoy-park.ru/api/health | head -c 200
            echo ""

            echo "=== Smoke tests ==="
            FAILED=0

            # Main page loads
            if curl -sf -o /dev/null -w "%{http_code}" https://delovoy-park.ru/ | grep -q "200"; then
              echo "✅ Main page: 200 OK"
            else
              echo "❌ Main page: FAILED"
              FAILED=$((FAILED + 1))
            fi

            # PS Park page loads
            if curl -sf -o /dev/null -w "%{http_code}" https://delovoy-park.ru/ps-park | grep -q "200"; then
              echo "✅ PS Park page: 200 OK"
            else
              echo "❌ PS Park page: FAILED"
              FAILED=$((FAILED + 1))
            fi

            # API responds with JSON
            if curl -sf https://delovoy-park.ru/api/ps-park/health | grep -q "status"; then
              echo "✅ PS Park API health: OK"
            else
              echo "❌ PS Park API health: FAILED"
              FAILED=$((FAILED + 1))
            fi

            # Telegram notifications pipeline health (warn-only — never increments FAILED)
            NH=$(curl -s --max-time 10 https://delovoy-park.ru/api/notifications/health || echo '{}')
            if echo "$NH" | jq -e '.data.ok==true' >/dev/null 2>&1; then
              echo "✅ Notifications health: OK"
            else
              echo "⚠️  Notifications health: FAILED"
              echo "$NH" | jq -c '.data.checks // .error // "no data"' || true
              TG_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
              TG_CHAT="${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}"
              if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
                curl -s "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
                  -d "chat_id=$TG_CHAT" \
                  -d "text=⚠️ Post-deploy: /api/notifications/health = FAIL. Проверь /admin/monitoring." \
                  -d "parse_mode=HTML" || true
              fi
            fi

            echo ""
            echo "=== Container status ==="
            docker ps --filter name=delovoy --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            if [ "$FAILED" -gt 0 ]; then
              echo "⚠️ $FAILED smoke test(s) failed — deploy succeeded but check manually"
            fi

      - name: Notify on success
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "text=✅ Deploy OK — v${{ needs.build-and-push.outputs.version }} (${{ github.sha }})" \
            -d "parse_mode=HTML" || true

      - name: Generate release notes & notify subscribers
        if: success()
        env:
          RELEASE_NOTIFY_SECRET: ${{ secrets.RELEASE_NOTIFY_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_URL: https://delovoy-park.ru
        run: |
          [ -z "$RELEASE_NOTIFY_SECRET" ] && echo "RELEASE_NOTIFY_SECRET not set, skipping" && exit 0

          VERSION="${{ needs.build-and-push.outputs.version }}"
          COMMIT_SHA="${{ github.sha }}"
          DEPLOYED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # deploy.yml runs on every push to main, not only on release-please
          # version bumps — package.json's version only changes when a
          # release-please PR merges. Without this guard, every ordinary
          # commit deployed afterward re-announces the same "new release"
          # with the already-announced version number (duplicate numbering).
          if ls docs/releases/"${VERSION}"-*.md >/dev/null 2>&1; then
            echo "v${VERSION} was already announced (docs/releases/${VERSION}-*.md exists) — skipping duplicate notification"
            exit 0
          fi

          # --- Step 1: Check for manual release notes in docs/releases/current.md ---
          NOTES=""
          if [ -f "docs/releases/current.md" ]; then
            MANUAL=$(sed '/^>/d;/^#/d;/^[[:space:]]*$/d;/^-$/d;/^- *$/d' docs/releases/current.md | head -60)
            if [ -n "$MANUAL" ]; then
              NOTES="$MANUAL"
              echo "Using manually written release notes"
            fi
          fi

          # --- Step 2: Auto-generate with Gemini 2.5 Flash if no manual notes ---
          if [ -z "$NOTES" ] && [ -n "$GEMINI_API_KEY" ]; then
            echo "No manual notes — generating with Gemini 2.5 Flash..."

            LAST_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"- %s" --no-merges | head -40)
            else
              COMMITS=$(git log -20 --pretty=format:"- %s" --no-merges)
            fi
            [ -z "$COMMITS" ] && COMMITS="- (no commits found)"

            PROMPT_TEXT="Ты — AI-ассистент бизнес-парка Деловой (Селятино). Сгенерируй краткие release notes на русском для Telegram.
          Правила:
          - Маркированный список, 3-7 пунктов
          - Группируй: новое, исправления, техническое
          - Понятно для менеджеров, не для разработчиков
          - Только плоский текст с дефисами, без markdown
          - Без заголовков, версии или даты
          - Макс 500 символов

          Коммиты:
          ${COMMITS}"

            PROMPT_JSON=$(printf '%s' "$PROMPT_TEXT" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")

            GEMINI_RESPONSE=$(curl -s --max-time 30 \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"contents\":[{\"parts\":[{\"text\":${PROMPT_JSON}}]}]}")

            NOTES=$(echo "$GEMINI_RESPONSE" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              print(data['candidates'][0]['content']['parts'][0]['text'].strip())
          except Exception:
              print('')
          " 2>/dev/null)

            if [ -n "$NOTES" ]; then
              echo "AI-generated release notes:"
              echo "$NOTES"
            else
              echo "Gemini failed — falling back to commit list"
              NOTES="$COMMITS"
            fi

          elif [ -z "$NOTES" ]; then
            echo "No GEMINI_API_KEY — using raw commit list"
            LAST_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              NOTES=$(git log "${LAST_TAG}..HEAD" --pretty=format:"- %s" --no-merges | head -20)
            else
              NOTES=$(git log -10 --pretty=format:"- %s" --no-merges)
            fi
          fi

          # --- Step 3: Send to subscribers ---
          NOTES_JSON=$(printf '%s' "$NOTES" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")

          PAYLOAD=$(cat <<EOFPAYLOAD
          {
            "secret": "${RELEASE_NOTIFY_SECRET}",
            "version": "${VERSION}",
            "releaseNotes": ${NOTES_JSON},
            "commitSha": "${COMMIT_SHA}",
            "deployedAt": "${DEPLOYED_AT}"
          }
          EOFPAYLOAD
          )

          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${APP_URL}/api/admin/release-notify")
          echo "Release notify response: $RESPONSE"

          # --- Step 4: Archive release notes ---
          ARCHIVE_NAME="docs/releases/${VERSION}-$(date +%Y-%m-%d).md"
          echo "# Release v${VERSION} — $(date +%Y-%m-%d)" > "$ARCHIVE_NAME"
          echo "" >> "$ARCHIVE_NAME"
          echo "$NOTES" >> "$ARCHIVE_NAME"

          cat > docs/releases/current.md << 'EOFTEMPLATE'
          # Что выкатилось в этом релизе

          > Заполни вручную перед деплоем. Если оставить пустым — AI сгенерирует из git log.

          ## Новое

          -

          ## Исправлено

          -

          ## Технические изменения

          -
          EOFTEMPLATE
          sed -i 's/^          //' docs/releases/current.md

          git config user.email "ci@delovoy-park.ru"
          git config user.name "Delovoy CI"
          git add "$ARCHIVE_NAME" docs/releases/current.md || true
          git diff --staged --quiet || git commit -m "chore(releases): archive v${VERSION} notes [skip ci]" || true
          git push origin HEAD || true

      - name: Notify on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "text=🚨 Deploy FAILED — commit ${{ github.sha }}" \
            -d "parse_mode=HTML" || true
