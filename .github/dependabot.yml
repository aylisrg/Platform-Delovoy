version: 2
# Минимальный режим: раз в месяц по одному групповому PR на экосистему,
# только minor+patch. Мажоры не предлагаются вообще — их обновляем руками,
# отдельной задачей с ревью. Мержит человек после зелёного CI.
# Security-алерты Dependabot (настройки репозитория) работают независимо от
# этого файла.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "01:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    # "/" покрывает .github/workflows; composite actions лежат отдельно.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "monthly"
      time: "01:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
