# Standalone agent compose for Hetzner VPS.
# Only the Claude Code agent — no app/postgres/redis.
# Usage: docker compose -f docker-compose.agent.yml up -d

services:
  agent:
    image: ghcr.io/aylisrg/platform-delovoy-agent:latest
    container_name: delovoy-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AGENT_WORKSPACE: /workspace
    volumes:
      - /opt/claude-agent-workspace:/workspace
      - /opt/claude-auth:/home/node/.claude
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
