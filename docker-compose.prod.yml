# Production docker-compose for Timeweb VPS
# Nginx + SSL handled by host-level nginx (see scripts/setup-vps.sh)

services:
  postgres:
    image: postgres:16-alpine
    container_name: delovoy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: delovoy_park
      POSTGRES_USER: delovoy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delovoy -d delovoy_park"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: delovoy-redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    # DEPLOY_IMAGE переопределяется только при откате (deploy.yml: rollback
    # на локальный image ID предыдущего билда); обычный деплой — :latest.
    image: ${DEPLOY_IMAGE:-ghcr.io/aylisrg/platform-delovoy:latest}
    container_name: delovoy-app
    # unless-stopped, НЕ on-failure:N — иначе после N быстрых крашей (OOM,
    # недоступная БД на старте) Docker перестаёт поднимать app и сайт лежит
    # до ручного вмешательства. Защита от бесконечного crash loop есть в
    # docker-entrypoint.sh (sleep 30 при рестарте чаще раза в 30с).
    restart: unless-stopped
    labels:
      - "autoheal=true"  # рестарт по unhealthy — см. сервис autoheal ниже
    ports:
      - "127.0.0.1:3000:3000"  # Only localhost — nginx handles external traffic
    env_file:
      - .env
    environment:
      # connection_limit ограничивает пул Prisma: Postgres живёт в 512M и
      # дефолтный пул (num_cpus*2+1 на процесс) при бурсте выедает его память.
      # pool_timeout=20 — при исчерпании пула ждём, а не падаем сразу (P2024).
      DATABASE_URL: "postgresql://delovoy:${POSTGRES_PASSWORD}@postgres:5432/delovoy_park?connection_limit=10&pool_timeout=20"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: "production"
      NEXTAUTH_URL: "https://delovoy-park.ru"
      NEXT_PUBLIC_APP_URL: "https://delovoy-park.ru"
      AUTH_TRUST_HOST: "true"
      # Куча V8 должна знать про cgroup-лимит 1.5G, иначе V8 целится в память
      # хоста и контейнер убивается OOM-киллером вместо мягкого GC.
      # ~75% лимита: остальное — стек, буферы, native-память.
      NODE_OPTIONS: "--max-old-space-size=1152"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "--timeout=5", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          # Сервер подтверждённо 2 CPU / 4 GB (preset 2453, проверено
          # 2026-07-18 через Timeweb API) — сумма лимитов ~2.4G из 3.9G.
          memory: 1536M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Blue-green слот B (см. scripts/deploy-bluegreen.sh): вторая копия app на
  # 127.0.0.1:3001. Вне профиля bluegreen обычный `up -d` его не трогает —
  # поднимается только скриптом деплоя. Активный слот записан в
  # /opt/delovoy-park/ACTIVE_SLOT, nginx-upstream указывает на его порт.
  # Лимит памяти ниже (1024M): слоты живут вместе только окно деплоя.
  app-b:
    image: ${DEPLOY_IMAGE:-ghcr.io/aylisrg/platform-delovoy:latest}
    container_name: delovoy-app-b
    restart: unless-stopped
    profiles: ["bluegreen"]
    labels:
      - "autoheal=true"
    ports:
      - "127.0.0.1:3001:3000"  # only localhost — nginx flips upstream to 3001
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://delovoy:${POSTGRES_PASSWORD}@postgres:5432/delovoy_park?connection_limit=10&pool_timeout=20"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: "production"
      NEXTAUTH_URL: "https://delovoy-park.ru"
      NEXT_PUBLIC_APP_URL: "https://delovoy-park.ru"
      AUTH_TRUST_HOST: "true"
      NODE_OPTIONS: "--max-old-space-size=768"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "--timeout=5", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # TLS-edge (issue #453, ADR 2026-07-23 §I2): официальный образ nginx:mainline
  # (Debian trixie, OpenSSL ≥3.5 из коробки) — единственная роль: постквантовое
  # рукопожатие (X25519MLKEM768). Системный OpenSSL хоста — 3.0.13, ML-KEM не
  # умеет и не апгрейдится в рамках Ubuntu LTS, поэтому TLS вынесен сюда.
  # Остальная логика (blue-green upstream, static-archive, /api/health) —
  # по-прежнему на host-nginx, теперь на 127.0.0.1:8443, см.
  # infra/nginx/delovoy-park.conf.
  #
  # network_mode: host — без docker-бриджа/NAT, $remote_addr = реальный IP
  # клиента (важно для X-Real-IP → rate-limit, CLAUDE.md §API conventions).
  # "ports:" здесь недопустим вместе с network_mode: host — сокеты
  # открываются прямо в сетевом стеке хоста. /dev/null поверх default.conf —
  # иначе штатный сервер образа (слушает :80) конфликтует с host-nginx,
  # который держит публичный :80 (HTTP→HTTPS redirect).
  edge:
    image: nginx:mainline
    container_name: delovoy-edge
    restart: unless-stopped
    network_mode: host
    labels:
      - "autoheal=true"
    volumes:
      - ./infra/nginx/edge/delovoy-edge.conf:/etc/nginx/conf.d/delovoy-edge.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Telegram bot (@DelovoyPark_bot) — separate process, same image.
  # entrypoint: [] overrides the inherited docker-entrypoint.sh (миграции +
  # Next.js — боту не нужно). Долгий polling через grammY.
  # restart: unless-stopped — НЕ always: при ручном `docker stop` не уйти в loop,
  # иначе два инстанса с одним токеном дадут 409 Conflict от Telegram.
  bot:
    image: ghcr.io/aylisrg/platform-delovoy:latest
    container_name: delovoy-bot
    restart: unless-stopped
    labels:
      - "autoheal=true"  # зависший long-polling лечится рестартом (см. healthcheck)
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://delovoy:${POSTGRES_PASSWORD}@postgres:5432/delovoy_park?connection_limit=3&pool_timeout=20"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: "production"
      NEXT_PUBLIC_APP_URL: "https://delovoy-park.ru"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: []
    command: ["npx", "tsx", "bot/index.ts"]
    # У long-polling процесса нет порта — здоровье проверяем по свежести
    # heartbeat-файла (bot/index.ts пишет его каждые 60с; -mmin -3 = не старше
    # 3 минут). Сетевые сбои Telegram здоровье НЕ роняют — только зависание.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/bot-healthy -mmin -3 2>/dev/null | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Docker Compose (без оркестратора) сам НЕ перезапускает unhealthy-контейнеры:
  # restart-политика реагирует только на выход процесса. autoheal закрывает эту
  # дыру — рестартует контейнеры с label autoheal=true, когда healthcheck падает
  # (зависший процесс, исчерпанный пул соединений и т.п.).
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: delovoy-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: "autoheal"
      AUTOHEAL_INTERVAL: "15"
      # Даём entrypoint app дожить до health: старт тяжёлый (prisma + seed)
      AUTOHEAL_START_PERIOD: "120"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  postgres_data:
  redis_data:

# IPv6-egress контейнеров (обход v4-блокировки api.telegram.org) включается
# НЕ здесь, а файлом /opt/delovoy-park/docker-compose.override.yml + правкой
# /etc/docker/daemon.json — одним действием workflow'а ops-docker-ipv6.yml.
# В репо-компоузе enable_ipv6 не включаем сознательно: деплой пересоздал бы
# сеть раньше, чем на хосте готов ip6tables (v6 без NAT66 = таймауты).
